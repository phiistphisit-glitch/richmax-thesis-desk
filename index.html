<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>โต๊ะตรวจสารนิพนธ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* ผัง: แถบหัวกรมท่า + แท็บ แล้วโต๊ะสามช่อง คำถาม | คำตอบ (กระดาษเล่ม) | ที่มาของคำตอบ — โหมดสว่างอย่างเดียวตามที่ผู้ใช้กำหนด */
:root{
  color-scheme:light;
  --ink:#14233f; --ink-2:#4a5a78; --ink-3:#7d8aa3;
  --navy:#13284d; --navy-2:#1c3766;
  --paper:#ffffff; --desk:#f2f5fa; --line:#dfe5ef; --line-2:#c9d2e1;
  --blue:#1f5fd6; --blue-soft:#e8f0fe;
  --ok:#17804a; --ok-soft:#e5f5ec;
  --fix:#b85c00; --fix-soft:#fff2df; --fix-hl:#ffe7c2;
  --chk:#6b4fc4; --chk-soft:#efeafd;
  --ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Thonburi",sans-serif;
  --doc:"Sarabun","Thonburi",Georgia,serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:#aebcd8;letter-spacing:.04em}
.doc-meta{flex:1;min-width:220px;border-left:1px solid rgba(255,255,255,.18);padding-left:18px}
.doc-meta b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.doc-meta span{font-size:12.5px;color:#aebcd8}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:#d7e0f1}
.bar{width:120px;height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.role{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.role button{border:0;background:transparent;color:#d7e0f1;padding:5px 12px;border-radius:6px;font-size:13px}
.role button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:600}
.sync{font-size:12px;color:#aebcd8;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#f0b44c;display:inline-block}
.sync.on i{background:#4cd18a}

.tabs{display:flex;gap:4px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:13px 14px 11px;font-size:15px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--blue);font-weight:600}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--fix-soft);color:var(--fix);font-size:12px;font-weight:600}

/* desk */
.desk{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;height:calc(100% - 128px);min-height:560px}
.col{overflow-y:auto;min-width:0}
.qcol{background:var(--paper);border-right:1px solid var(--line)}
.scol{background:var(--paper);border-left:1px solid var(--line)}
.colhead{position:sticky;top:0;z-index:2;background:inherit;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.filter{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.filter button{border:1px solid var(--line-2);background:var(--paper);border-radius:20px;padding:2px 10px;font-size:12.5px;color:var(--ink-2)}
.filter button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}

.grp{padding:12px 16px 4px;font-size:12.5px;font-weight:600;color:var(--navy-2);display:flex;justify-content:space-between;gap:8px}
.grp span{color:var(--ink-3);font-weight:400}
.qi{display:grid;grid-template-columns:18px 1fr;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 16px 8px 14px;border-left:3px solid transparent}
.qi:hover{background:var(--desk)}
.qi[aria-current=true]{background:var(--blue-soft);border-left-color:var(--blue)}
.qi b{display:block;font-weight:500;font-size:14px;line-height:1.4}
.qi small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.4;margin-top:2px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid var(--line-2);background:var(--paper)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.fix{background:var(--fix);border-color:var(--fix)}
.dot.part{border-color:var(--blue);background:linear-gradient(90deg,var(--blue) 50%,var(--paper) 50%)}

/* answer column */
.acol{padding:22px 28px 40px}
.qcard{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 20px;display:grid;gap:6px;max-width:820px;margin:0 auto}
.qcard .lbl{font-size:12px;letter-spacing:.08em;color:#aebcd8}
.qcard .qt{font-size:18px;font-weight:600;line-height:1.45;text-wrap:balance}
.qcard .sec{font-size:13px;color:#d7e0f1}
.verdict{max-width:820px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.verdict .lbl{font-size:13px;color:var(--ink-2);margin-right:4px}
.vbtn{border:1.5px solid var(--line-2);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.vbtn svg{width:16px;height:16px}
.vbtn.ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.vbtn.fix[aria-pressed=true]{background:var(--fix);border-color:var(--fix);color:#fff}
.vbtn.clear{border-color:transparent;color:var(--ink-3);padding:7px 8px}

.paper{background:var(--paper);max-width:820px;margin:14px auto 0;border:1px solid var(--line);border-radius:var(--r);padding:26px 30px 22px;box-shadow:0 1px 2px rgba(20,35,63,.05)}
.paper .pmeta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap}
.paper h3{font-family:var(--doc);font-size:24px;line-height:1.35;margin:0 0 12px;font-weight:600;text-wrap:balance}
.para{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:5px 8px;margin:0 -8px;border-radius:6px;border-left:3px solid transparent}
.para .tx{font-family:var(--doc);font-size:18px;line-height:1.75;text-indent:2.2em;overflow-wrap:anywhere}
.para.h .tx{text-indent:0;font-weight:600;font-size:18.5px;margin-top:8px}
.para.cap .tx{text-indent:0;font-weight:600;font-size:16px;margin-top:8px}
.para.row .tx{text-indent:0;font-family:var(--ui);font-size:14px;line-height:1.5;background:var(--desk);padding:4px 10px;border-radius:4px}
.para.li .tx{text-indent:0;padding-left:1.4em}
.para.li .tx::before{content:"•";margin-left:-1em;margin-right:.5em;color:var(--ink-3)}
.para.sel{background:var(--blue-soft)}
.para.m-fix{background:var(--fix-hl);border-left-color:var(--fix)}
.para.m-ok{border-left-color:var(--ok)}
.para.has-note::after{content:attr(data-n);position:absolute;left:-26px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--fix);color:#fff;font:600 11px/18px var(--ui);text-align:center}
.pm{display:flex;gap:4px;opacity:.55;transition:opacity .15s}
.para:hover .pm,.para.sel .pm,.para.m-fix .pm,.para.m-ok .pm{opacity:1}
.pm button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink-3)}
.pm button svg{width:16px;height:16px}
.pm button.ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.pm button.fix[aria-pressed=true]{background:var(--fix);border-color:var(--fix);color:#fff}
.hint{font-size:13px;color:var(--ink-3);margin:2px 0 10px}

/* composer */
.compose{max-width:820px;margin:16px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.compose h4,.notes h4{margin:0 0 8px;font-size:14px;font-weight:600}
.anchor{font-size:13px;color:var(--blue);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.anchor button{border:0;background:none;color:var(--ink-3);font-size:12.5px;text-decoration:underline}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.mic{width:54px;height:54px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(31,95,214,.35)}
.mic svg{width:24px;height:24px}
.mic.live{background:var(--fix);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,92,0,.45)}70%{box-shadow:0 0 0 12px rgba(184,92,0,0)}100%{box-shadow:0 0 0 0 rgba(184,92,0,0)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
textarea{width:100%;min-height:76px;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;resize:vertical;font-size:16px;background:var(--paper)}
.tip{display:none;margin-top:8px;font-size:13px;background:var(--blue-soft);color:var(--navy-2);border-radius:8px;padding:8px 12px}
.tip.show{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px dashed var(--line-2);background:var(--paper);border-radius:16px;padding:3px 10px;font-size:13px;color:var(--ink-2)}
.cfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.btn{border:0;border-radius:8px;padding:9px 18px;background:var(--blue);color:#fff;font-weight:600}
.btn.ghost{background:var(--desk);color:var(--ink-2);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}

.notes{max-width:820px;margin:14px auto 0}
.note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--blue-soft);color:var(--blue)}
.av.st{background:var(--ok-soft);color:var(--ok)}
.note .who{font-size:13.5px;font-weight:600}
.note .who span{font-weight:400;color:var(--ink-3);font-size:12.5px;margin-left:6px}
.note .body{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .ref{font-size:12.5px;color:var(--blue);background:none;border:0;padding:0;text-decoration:underline}
.note .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:12px;padding:1px 10px;font-size:12px;font-weight:600}
.pill.wait{background:var(--fix-soft);color:var(--fix)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.chk{background:var(--chk-soft);color:var(--chk)}
.pill.pass{background:var(--ok-soft);color:var(--ok)}
.lnk{border:0;background:none;color:var(--blue);font-size:13px;padding:0}
.lnk.dim{color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13.5px;padding:8px 2px}

/* source column */
.sbox{padding:14px 16px;border-bottom:1px solid var(--line)}
.sbox h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--navy-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.ok-t{color:var(--ok)} .fix-t{color:var(--fix)}
.file{display:flex;gap:10px;align-items:center;background:var(--desk);border-radius:8px;padding:10px;margin-bottom:12px}
.file svg{width:28px;height:28px;flex:none;color:#c0392b}
.file b{display:block;font-size:13.5px;line-height:1.35}
.file span{font-size:12px;color:var(--ink-3)}
.pagestrip{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}
.pagestrip i{width:9px;height:14px;border-radius:2px;background:var(--line)}
.pagestrip i.on{background:var(--blue)}
.ref-i{font-size:13px;line-height:1.5;padding:8px 0;border-top:1px dashed var(--line)}
.ref-i:first-of-type{border-top:0}
.ref-i b{color:var(--navy-2)}
.fd{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:13.5px;line-height:1.5;padding:8px 0;border-top:1px dashed var(--line)}
.fd:first-of-type{border-top:0}
.xlist{display:flex;flex-direction:column;gap:6px}
.xlist button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.xlist button:hover{border-color:var(--blue)}

/* steps */
.sumlist{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.sumlist li{font-family:var(--doc);font-size:17px;line-height:1.6;padding:3px 0 3px 18px;position:relative}
.sumlist li::before{content:"";position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.sumlist li.lk{color:var(--blue)}
.sumlist li.lk button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2)}
.excerpt{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}
.excerpt header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.excerpt header b{font-size:15px}
.excerpt p{font-family:var(--doc);font-size:16.5px;line-height:1.7;margin:4px 0;color:var(--ink-2)}
.stepnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--desk);font-size:12px;font-weight:600;color:var(--navy-2)}
.qi[aria-current=true] .stepnum{background:var(--blue);color:#fff}

/* calendar */
.page{padding:22px 28px 40px;overflow-y:auto;height:calc(100% - 128px)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1200px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.calhead h2{margin:0;font-size:20px}
.calhead .nav{display:flex;gap:6px}
.calhead .nav button{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:5px 12px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.grid7 .wd{font-size:12.5px;color:var(--ink-3);text-align:center;padding:4px 0}
.day{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{background:var(--desk);color:var(--ink-3)}
.day.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.day.pick{background:var(--blue-soft)}
.day .dn{font-size:13px;font-weight:600}
.ev{font-size:11.5px;line-height:1.3;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.t0{background:var(--blue-soft);color:var(--blue)}
.ev.t1{background:var(--fix-soft);color:var(--fix)}
.ev.t2{background:var(--chk-soft);color:var(--chk)}
.ev.t3{background:var(--ok-soft);color:var(--ok)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.form input,.form select{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--paper);width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evl{display:grid;gap:8px;margin-top:6px}
.evi{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.evi .d{text-align:center;line-height:1.15}
.evi .d b{display:block;font-size:20px}
.evi .d span{font-size:11.5px;color:var(--ink-3)}
.evi .t{font-weight:500;font-size:14px}
.evi .t span{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1200px;margin:0 auto 18px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile span{font-size:13px;color:var(--ink-2)}
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:1200px;margin:0 auto}
.chrow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0}
.chrow .bar{width:100%;background:var(--desk);height:10px}
.chrow .bar i.ok{background:var(--ok)} .chrow .bar i.fix{background:var(--fix)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.pend small{display:block;color:var(--ink-3);font-size:12.5px}

.mbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1180px){
  .desk{grid-template-columns:260px minmax(0,1fr) 280px}
  .acol{padding:18px 18px 40px}
}
@media (max-width:980px){
  .desk{display:block;height:auto}
  .qcol{display:none;border-right:0;border-bottom:1px solid var(--line);max-height:60vh}
  .qcol.open{display:block}
  .scol{border-left:0;border-top:1px solid var(--line)}
  .mbar{display:flex;gap:8px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);align-items:center}
  .mbar button{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:14px}
  .mbar span{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .page{height:auto}
  .calwrap,.sumgrid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:600px){
  .top{padding:10px 16px;gap:10px}
  .doc-meta{border-left:0;padding-left:0;flex-basis:100%}
  .tabs{padding:0 8px}
  .acol,.page{padding:14px 16px 32px}
  .paper{padding:18px 16px}
  .para .tx{font-size:16.5px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .day{min-height:58px;padding:3px}
  .ev{font-size:10px;padding:0 3px}
  .chrow{grid-template-columns:96px minmax(0,1fr) 54px}
  .para.has-note::after{left:auto;right:-6px;top:-6px}
}
</style>

"paras":[{"t":"ชื่อผู้ทำการค้นคว้าอิสระ นายพิสิษฐ์ มหาดำรงไพศาล","k":"p"},{"t":"ชื่อการค้นคว้าอิสระ การพัฒนาระบบเอไอเอเจนต์อีอาร์พีเพื่อเพิ่มประสิทธิภาพการเสนอราคาและการวางแผนผลิตในอุตสาหกรรมพิมพ์บรรจุภัณฑ์","k":"p"},{"t":"ชื่ออาจารย์ที่ปรึกษาการค้นคว้าอิสระ ผู้ช่วยศาสตราจารย์ ดร.วิชิต สุรดินทร์กูร","k":"p"},{"t":"ชื่อปริญญา ศิลปศาสตรมหาบัณฑิต สาขาวิชาการบริหารการพัฒนา","k":"p"},{"t":"คำสำคัญ AI Agent ERP / การพิมพ์บรรจุภัณฑ์ / การเสนอราคา / การวางแผนการผลิต / Design Science Research","k":"p"},{"t":"อุตสาหกรรมการพิมพ์ของไทย โดยเฉพาะโรงพิมพ์ที่รับงานตามคำสั่ง เผชิญปัญหาการออกใบเสนอราคาที่ใช้เวลานาน ความคลาดเคลื่อนของข้อมูลคำสั่งผลิต และการวางแผนการผลิตที่พึ่งพาความรู้ฝังลึกของบุคลากร การวิจัยนี้มีวัตถุประสงค์เพื่อ (1) ศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบปัญญาประดิษฐ์แบบเอเจนต์ร่วมกับระบบวางแผนทรัพยากรองค์กร (AI Agent ERP) เพื่อสนับสนุนการรับงาน การเสนอราคา และการวางแผนการผลิต (2) ออกแบบและพัฒนาระบบต้นแบบ และ (3) ประเมินความเหมาะสมของระบบ และเปรียบเทียบผลการดำเนินงานก่อนและหลังการใช้ระบบ การวิจัยใช้แนว Design Science Research ร่วมกับการวิจัยและพัฒนา เก็บข้อมูลจากผู้เชี่ยวชาญ 10 คน ผู้ใช้ระบบ 20 คน และบิลงาน 30 คู่แบบก่อน–หลัง วิเคราะห์ด้วยสถิติเชิงพรรณนาและ Paired Samples t-test ผลการวิจัยพบว่า ความเหมาะสมของระบบโดยรวมอยู่ในระดับมาก ผลการทดสอบสมมติฐานสนับสนุนทั้งสามข้อ โดยเวลาในการออกใบเสนอราคาลดลงจาก 52.40 เป็น 18.70 นาที (ลดลงร้อยละ 64.31) ความถูกต้องของข้อมูลคำสั่งผลิตเพิ่มขึ้นจากร้อยละ 88.50 เป็นร้อยละ 97.80 และเวลาในการจัดทำแผนการผลิตลดลงจาก 38.60 เป็น 14.20 นาที (ลดลงร้อยละ 63.21) โดยการทดสอบ paired t ที่ df = 29 รองรับสมมติฐานที่กำหนด ผลการวิจัยเป็นประโยชน์ต่อการพัฒนากระบวนการจัดการงานพิมพ์และการบูรณาการความรู้เข้ากับระบบสารสนเทศในโรงพิมพ์","k":"p"}],"pdf":3,"pdfEnd":3,"book":null,"bookEnd":null,"toc":null,"cites":[],"q":"บทคัดย่อภาษาไทยครอบคลุมวัตถุประสงค์ วิธีวิจัย ผลการวิจัย และตัวเลขสำคัญครบหรือไม่","fd":[]},{"id":"f-3","title":"บทคัดย่อภาษาอังกฤษ","group":"ส่วนนำ","ch":null,"paras":[{"t":"Author's name: Phisit Mahadamrongpaisarn","k":"p"},{"t":"Master's Report title: AI Agent ERP for Improving Quotation Efficiency and Production Planning in the Packaging Printing Industry","k":"p"},{"t":"Master's Report advisor: Assistant Professor Dr. Vichit Suradinkura","k":"p"},{"t":"Degree: Master of Arts (Development Administration)","k":"p"},{"t":"Keywords: AI Agent ERP / Packaging Printing / Quotation / Production Planning / Design Science Research","k":"p"},{"t":"The Thai printing industry, particularly make-to-order printing houses, faces prolonged quotation lead times, inaccuracies in production-order data, and production planning that depends heavily on tacit staff knowledge. This study aims to (1) examine problems, requirements, and essential components of an AI Agent integrated with Enterprise Resource Planning (AI Agent ERP) to support order intake, quotation, and production planning; (2) design and develop a prototype system; and (3) evaluate system suitability and compare operational outcomes before and after implementation. The research adopted Design Science Research combined with research and development. Data were collected from 10 experts, 20 system users, and 30 paired job bills (before-after), and analyzed using descriptive statistics and Paired Samples t-tests. Results indicated that overall system suitability was at a high level. All three hypotheses were supported: quotation time decreased from 52.40 to 18.70 minutes (—64.31%), production-order data accuracy increased from 88.50% to 97.80%, and production-planning time decreased from 38.60 to 14.20 minutes (—63.21%), with paired-t tests at df = 29 supporting the stated hypotheses. The findings are useful for improving print-job management processes and integrating organizational knowledge into information systems in printing houses.","k":"p"}],"pdf":4,"pdfEnd":4,"book":null,"bookEnd":null,"toc":null,"cites":[],"q":"บทคัดย่อภาษาอังกฤษแปลตรงกับฉบับภาษาไทย และตัวเลขตรงกันหรือไม่","fd":[]},{"id":"f-4","title":"สารบัญ","group":"ส่วนนำ","ch":nu ัญภาพ","k":"row"},{"t":"— ไม่มีรายการภาพในเล่มนี้ —","k":"row"},{"t":"หมายเหตุ: กรอบแนวคิดการวิจัยนำเสนอเป็นข้อความในหัวข้อ 2.8 ไม่ได้แทรกเป็นไฟล์ภาพแยก","k":"p"}],"pdf":5,"pdfEnd":9,"book":null,"bookEnd":null,"toc":null,"cites":[],"q":"สารบัญ สารบัญตาราง และเลขหน้า ตรงกับเนื้อหาจริงในเล่มหรือไม่","fd":[]},{"id":"c1-1","title":"1.1 ความเป็นมาและความสำคัญของปัญหา","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"อุตสาหกรรมการพิมพ์เป็นอุตสาหกรรมที่เกี่ยวข้องกับกิจกรรมทางเศรษฐกิจหลายด้าน ทั้งภาคการผลิต การค้า การบริการ และการสื่อสาร โดยเฉพาะธุรกิจการพิมพ์ที่มีลักษณะการผลิตตามคำสั่งของลูกค้า (Job Order Production) ซึ่งงานแต่ละรายการมีข้อกำหนดแตกต่างกันในด้านประเภทวัสดุ ขนาด จำนวน สี กระบวนการพิมพ์ กระบวนการหลังพิมพ์ และเงื่อนไขการส่งมอบ ส่งผลให้การบริหารจัดการคำสั่งผลิตจำเป็นต้องอาศัยข้อมูลจากหลายส่วนขององค์การประกอบกัน","k":"p"},{"t":"กระบวนการดำเนินงานของโรงพิมพ์ประกอบด้วยกิจกรรมที่เชื่อมโยงกันตั้งแต่การรับงาน (Order Intake) การเสนอราคา (Quotation) การวางแผนการผลิต (Production Planning) การผลิต (Production) จนถึงการส่งมอบ (Delivery) โดยเฉพาะกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต ซึ่งเป็นกระบวนการต้นน้ำที่เกี่ยวข้องกับข้อมูลสำคัญ ได้แก่ ข้อกำหนดของลูกค้า ราคาวัตถุดิบ ต้นทุนการผลิต ความพร้อมของวัตถุดิบ ข้อมูลเครื่องจักร กำลังการผลิต และระยะเวลาส่งมอบ หากข้อมูลในกระบวนการดังกล่าวไม่ครบถ้วน ล่าช้า หรือคลาดเคลื่อน ย่อมส่งผลต่อการดำเนินงานในขั้นตอนต่อเนื่องกัน","k":"p"},{"t":"เมื่อพิจารณากระบวนการดังกล่าวในมุมมองเชิงระบบ พบว่าการรับงาน การเสนอราคา และการวางแผนการผลิตมิได้ดำเนินการโดยหน่วยงานใดหน่วยงานหนึ่งเพียงลำพัง แต่ต้องอาศัยข้อมูลและการประสานงานระหว่างฝ่ายขาย ฝ่ายจัดซื้อ ฝ่ายวางแผนการผลิต ฝ่ายผลิต และหน่วยงานที่เกี่ยวข้อง ข้อมูลจากแต่ละส่วนต้องได้รับการตรวจสอบ ประมวลผล และนำมาใช้ประกอบการตัดสินใจร่วมกัน ความล่าช้าหรือความคลาดเคลื่อนของข้อมูลในส่วนหนึ่งจึงสามารถส่งผลต่อประสิทธิภาพของกระบวนการส่วนอื่นได้","k":"p"},{"t":"จากการศึกษาสภาพการดำเนินงานของโรงพิมพ์กรณีศึกษา พบปัญหาสำคัญ 4 ประการ ได้แก่","k":"p"},{"t":"ประกาศ กระบวนการออกใบเสนอราคาใช้เวลาประมาณ 45-60 นาทีต่อรายการ เนื่องจากผู้ปฏิบัติงานต้องรวบรวมและตรวจสอบข้อมูลจากหลายแหล่ง เช่น ข้อกำหนดของงาน ราคาวัตถุดิบ ข้อมูลต้นทุน และข้อมูลที่เกี่ยวข้องกับกระบวนการผลิต ก่อนนำข้อมูลมาคำนวณและจัดทำใบเสนอราคา","k":"p"},{"t":"ประกาศที่สอง พบความคลาดเคลื่อนของข้อมูลคำสั่งผลิตประมาณร้อยละ 8–12 ต่อเดือน โดยความคลาดเคลื่อนที่พบเกี่ยวข้องกับข้อมูลสำคัญ เช่น จำนวน วัสดุ และกำหนดส่งมอบ ส่งผลให้ต้องมีการตรวจสอบ แก้ไขข้อมูล และดำเนินงานซ้ำในบางขั้นตอน","k":"p"},{"t":"ประกาศที่สาม การจัดทำแผนการผลิตยังอาศัยประสบการณ์และดุลพินิจของบุคลากรเป็นส่วนสำคัญ การตรวจสอบคิวเครื่องจักร ความพร้อมของวัตถุดิบ และเงื่อนไขของงานจึงต้องอาศัยการรวบรวมและประสานข้อมูลจากหลายส่วน ทำให้ใช้เวลาในการจัดทำแผนการผลิต","k":"p"},{"t":"ประกาศที่สี่ ความรู้สำคัญบางส่วนในการดำเนินงานยังอยู่ในรูปของความรู้ฝังลึก (Tacit Knowledge) ของบุคลากร เช่น ความรู้เกี่ยวกับการประเมินต้นทุน การเลือกวัสดุ การกำหนดกระบวนการผลิต และการจัดลำดับงาน ความรู้ดังกล่าวเกิดจากประสบการณ์ในการปฏิบัติงานและยังต้องพึ่งพาบุคลากรเฉพาะรายในหลายขั้นตอน","k":"p"},{"t":"ปัญหาดังกล่าวสะท้อนให้เห็นว่า การปรับปรุงกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตมิได้เกี่ยวข้องเฉพาะกับการนำเทคโนโลยีมาใช้ แต่เกี่ยวข้องกับการเชื่อมโยงข้อมูล กระบวนการทำงาน ความรู้ของบุคลากร และระบบสารสนเทศภายในองค์การ","k":"p"},{"t":"ระบบวางแผนทรัพยากรองค์กร (Enterprise Resource Planning: ERP) เป็นระบบสารสนเทศที่ใช้สนับสนุนการเชื่อมโยงข้อมูลและกระบวนการดำเนินงานของหน่วยงานต่าง ๆ ภายในองค์การ ทำให้ข้อมูลที่เกี่ยวข้องสามารถนำมาใช้ร่วมกันในการปฏิบัติงานและการตัดสินใจ อย่างไรก็ตาม การมีข้อมูลอยู่ในระบบ ERP มิได้หมายความว่าข้อมูลดังกล่าวจะสามารถนำมาใช้สนับสนุนกระบวนการที่มีเงื่อนไขหลายขั้นตอนได้โดยอัตโนมัติ ผู้ปฏิบัติงานยังต้องค้นหา ตรวจสอบ เชื่อมโยง และประมวลผลข้อมูลตามเงื่อนไขของแต่ละงาน","k":"p"},{"t":"ปัญญาประดิษฐ์แบบเอเจนต์ (AI Agent) เป็นแนวทางหนึ่งที่สามารถนำมาประยุกต์ใช้เพื่อสนับสนุนกระบวนการดังกล่าว โดยระบบสามารถรับข้อมูล ตรวจสอบความครบถ้วน เรียกใช้ข้อมูลหรือฟังก์ชันที่ได้รับอนุญาต ประมวลผลตามกฎและเงื่อนไขทางธุรกิจ และนำเสนอผลลัพธ์เพื่อสนับสนุนการปฏิบัติงานของบุคลากร","k":"p"},{"t":"ในการวิจัยครั้งนี้ AI Agent ถูกนำมาทำงานร่วมกับ ERP ข้อมูลต้นทุน กฎทางธุรกิจ และความรู้ที่เกี่ยวข้องกับกระบวนการทำงาน โดยกำหนดให้บุคลากรยังคงมีบทบาทในการตรวจสอบและยืนยันผลลัพธ์ (Human-in-the-loop) ก่อนนำข้อมูลสำคัญไปใช้ เพื่อให้ระบบทำหน้าที่สนับสนุนการปฏิบัติงานและการตัดสินใจ มิใช่ทดแทนการตัดสินใจของบุคลากรทั้งหมด","k":"p"},{"t":"นอกจากนี้ การพัฒนาระบบยังเกี่ยวข้องกับการจัดการความรู้ภายในองค์การ โดยเฉพาะการถ่ายทอดความรู้และประสบการณ์ของบุคลากรให้อยู่ในรูปของกฎ สูตร เงื่อนไข และขั้นตอนที่สามารถจัดเก็บและนำมาใช้ร่วมกับระบบได้ แนวคิดดังกล่าวมีความสอดคล้องกับแบบจำลอง SECI ของ Nonaka และ Takeuchi (1995) ซึ่งอธิบายการเปลี่ยนแปลงและการสร้างความรู้ระหว่างความรู้ฝังลึก (Tacit Knowledge) และความรู้ชัดแจ้ง (Explicit Knowledge)","k":"p"},{"t":"เมื่อพิจารณาในมิติของการบริหารการพัฒนา การนำ AI Agent มาประยุกต์ร่วมกับ ERP จึงเป็นการพัฒนากระบวนการทำงานโดยเชื่อมโยงบุคลากร ข้อมูล ความรู้ กระบวนการ และเทคโนโลยี เข้าด้วยกัน เพื่อสนับสนุนความสามารถในการดำเนินงานขององค์การอย่างเป็นระบบ","k":"p"},{"t":"ด้วยเหตุนี้ ผู้วิจัยจึงพัฒนาระบบปัญญาประดิษฐ์แบบเอเจนต์ร่วมกับระบบวางแผนทรัพยากรองค์กร (AI Agent ERP) เพื่อสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตของโรงพิมพ์กรณีศึกษา โดยศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ ออกแบบและพัฒนาระบบต้นแบบ ตลอดจนประเมินความเหมาะสมและผลการใช้งานจากข้อมูลการปฏิบัติงานจริง เพื่อศึกษาการเปลี่ยนแปลงด้านเวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต เวลาในการจัดทำแผนการผลิต และความพึงพอใจของผู้ใช้งาน","k":"p"}],"no":"1.1","pdf":10,"pdfEnd":11,"book":1,"bookEnd":2,"toc":1,"cites":[4],"q":"ปัญหาวิจัยคืออะไร มีหลักฐานเชิงตัวเลขยืนยันความสำคัญของปัญหาหรือไม่","fd":[]},{"id":"c1-2","title":"1.2 การวิเคราะห์สภาพแวดล้อมขององค์การ","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"เพื่อให้การพัฒนาระบบสอดคล้องกับบริบทของโรงพิมพ์กรณีศึกษา ผู้วิจัยใช้การวิเคราะห์ SWOT เพื่อพิจารณาจุดแข็ง (Strengths) จุดอ่อน (Weaknesses) โอกาส (Opportunities) และอุปสรรค (Threats) ที่เกี่ยวข้องกับการดำเนินงาน และใช้ TOWS Matrix เพื่อสังเคราะห์แนวทางที่เกี่ยวข้องกับการพัฒนาระบบ","k":"p"},{"t":"1.2.1 การวิเคราะห์ SWOT","k":"h"},{"t":"ตารางที่ 1.1 การวิเคราะห์ SWOT ของโรงพิมพ์กรณีศึกษา","k":"cap"},{"t":"ด้าน ผลการวิเคราะห์","k":"row"},{"t":"จุดแข็ง (Strengths) มีฐานลูกค้าประจำ มีระบบการผลิตรองรับงานพิมพ์ มีบุคลากรที่มีประสบการณ์ด้านการผลิต มีกระบวนการควบคุมคุณภาพ และมีข้อมูลจากการปฏิบัติงานจริง","k":"p"},{"t":"จุดอ่อน (Weaknesses) ระบบสารสนเทศบางส่วนยังแยกจากกัน กระบวนการทำงานบางขั้นตอนยังดำเนินการด้วยบุคลากร ความรู้บางส่วนผูกติดกับบุคลากร การเรียกใช้ข้อมูลต้นทุนยังไม่สามารถดำเนินการได้ทันทีในทุกขั้นตอน และพบความคลาดเคลื่อนของข้อมูลคำสั่งผลิต","k":"p"},{"t":"โอกาส (Opportunities) เทคโนโลยี AI และระบบสารสนเทศสามารถนำมาประยุกต์เพื่อสนับสนุนการประมวลผลข้อมูล การเชื่อมโยงข้อมูล การจัดการความรู้ และการตัดสินใจในการดำเนินงาน","k":"p"},{"t":"อุปสรรค (Threats) การเปลี่ยนแปลงของต้นทุนวัตถุดิบและพลังงาน การแข่งขันด้านราคา ความหลากหลายของข้อกำหนดจากลูกค้า และข้อจำกัดของบุคลากรที่มีความรู้และประสบการณ์เฉพาะด้าน","k":"p"},{"t":"ผลการวิเคราะห์แสดงให้เห็นว่า โรงพิมพ์กรณีศึกษามีทั้งทรัพยากร ข้อมูล และความรู้จากการปฏิบัติงานที่สามารถนำมาใช้เป็นพื้นฐานในการพัฒนาระบบ ขณะเดียวกันยังมีข้อจำกัดด้านการเชื่อมโยงข้อมูล ขั้นตอนการทำงาน และการพึ่งพาความรู้ของบุคลากร จึงนำไปสู่การวิเคราะห์ความต้องการของระบบต้นแบบในขั้นตอนต่อไป","k":"p"},{"t":"1.2.2 การวิเคราะห์ TOWS Matrix","k":"h"},{"t":"ตารางที่ 1.2 การวิเคราะห์ TOWS Matrix","k":"cap"},{"t":"แนวทาง การประยุกต์กับการวิจัย","k":"row"},{"t":"SO ใช้ข้อมูลการดำเนินงานและประสบการณ์ของบุคลากรร่วมกับเทคโนโลยี AI และ ERP เพื่อสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต","k":"p"},{"t":"WO ใช้ AI Agent และการเชื่อมโยงข้อมูล ERP เพื่อลดข้อจำกัดจากข้อมูลที่แยกส่วน ขั้นตอนที่ต้องประมวลผลด้วยบุคลากร และการพึ่งพาความรู้เฉพาะบุคคล","k":"p"},{"t":"ST ใช้ข้อมูลต้นทุน วัตถุดิบ และการผลิตที่เกี่ยวข้องเพื่อสนับสนุนการดำเนินงานภายใต้การเปลี่ยนแปลงของต้นทุนและข้อกำหนดของลูกค้า","k":"p"},{"t":"WT ใช้กฎการทำงาน การกำหนดสิทธิ์ การตรวจสอบข้อมูล และ Human-in-the-loop เพื่อลดความเสี่ยงจากข้อมูลและผลลัพธ์ที่คลาดเคลื่อน","k":"p"},{"t":"การวิเคราะห์ SWOT และ TOWS ในการวิจัยครั้งนี้ใช้เป็นเครื่องมือประกอบการวิเคราะห์บริบทและความต้องการของระบบ มิได้ใช้เป็นตัวแปรในการทดสอบสมมติฐานการวิจัย","k":"p"}],"no":"1.2","pdf":12,"pdfEnd":12,"book":3,"bookEnd":3,"toc":3,"cites":[],"q":"การวิเคราะห์สภาพแวดล้อมองค์การ นำไปสู่เหตุผลของการพัฒนาระบบอย่างไร","fd":[]},{"id":"c1-3","title":"1.3 คำถามการวิจัย","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"1. สภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ AI Agent ERP สำหรับสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตของโรงพิมพ์กรณีศึกษาเป็นอย่างไร","k":"p"},{"t":"2. ระบบต้นแบบ AI Agent ERP สำหรับสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตควรได้รับการออกแบบและพัฒนาอย่างไรให้สอดคล้องกับบริบทการดำเนินงานของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"3. ระบบต้นแบบ AI Agent ERP มีความเหมาะสมในระดับใด และภายหลังการใช้ระบบเวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต เวลาในการจัดทำแผนการผลิต และความพึงพอใจของผู้ใช้งานเป็นอย่างไร","k":"p"}],"no":"1.3","pdf":13,"pdfEnd":13,"book":4,"bookEnd":4,"toc":4,"cites":[],"q":"คำถามการวิจัยชัดเจน วัดได้ และสอดคล้องกับปัญหาหรือไม่","fd":[]},{"id":"c1-4","title":"1.4 วัตถุประสงค์การวิจัย","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"1. เพื่อศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ AI Agent ERP สำหรับสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"2. เพื่อออกแบบและพัฒนาระบบต้นแบบ AI Agent ERP สำหรับสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต","k":"p"},{"t":"3. เพื่อประเมินความเหมาะสมของระบบต้นแบบ AI Agent ERP และเปรียบเทียบผลการดำเนินงานก่อนและหลังการใช้ระบบในด้านเวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต และเวลาในการจัดทำแผนการผลิต รวมทั้งประเมินความพึงพอใจของผู้ใช้งาน","k":"p"}],"no":"1.4","pdf":14,"pdfEnd":14,"book":5,"bookEnd":5,"toc":5,"cites":[],"q":"วัตถุประสงค์ตอบคำถามการวิจัยครบทุกข้อหรือไม่","fd":[]},{"id":"c1-5","title":"1.5 สมมติฐานการวิจัย","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"สมมติฐานที่ 1 ภายหลังการใช้ระบบต้นแบบ AI Agent ERP ค่าเฉลี่ยเวลาในการออกใบเสนอราคาต่ำกว่าก่อนใช้ระบบอย่างมีนัยสำคัญทางสถิติที่ระดับ .05","k":"p"},{"t":"สมมติฐานที่ 2 ภายหลังการใช้ระบบต้นแบบ AI Agent ERP ค่าเฉลี่ยความถูกต้องของข้อมูลคำสั่งผลิตสูงกว่าก่อนใช้ระบบอย่างมีนัยสำคัญทางสถิติที่ระดับ .05","k":"p"},{"t":"สมมติฐานที่ 3 ภายหลังการใช้ระบบต้นแบบ AI Agent ERP ค่าเฉลี่ยเวลาในการจัดทำแผนการผลิตต่ำกว่าก่อนใช้ระบบอย่างมีนัยสำคัญทางสถิติที่ระดับ .05","k":"p"}],"no":"1.5","pdf":14,"pdfEnd":14,"book":5,"bookEnd":5,"toc":5,"cites":[],"q":"สมมติฐานระบุทิศทางและตัวแปรที่ทดสอบได้ทางสถิติหรือไม่","fd":[]},{"id":"c1-6","title":"1.6 ขอบเขตการวิจัย","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"1.6.1 ขอบเขตด้านเนื้อหา","k":"h"},{"t":"การวิจัยมุ่งศึกษาและพัฒนาระบบต้นแบบ AI Agent ERP เพื่อสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต โดยครอบคลุมการทำงาน 5 ส่วน ได้แก่","k":"p"},{"t":"1. การรับและตรวจสอบข้อกำหนดของงาน","k":"p"},{"t":"2. การเรียกใช้ข้อมูลลูกค้าและข้อมูลต้นทุนที่เกี่ยวข้องจากระบบ ERP","k":"p"},{"t":"3. การคำนวณและจัดทำข้อเสนอราคา","k":"p"},{"t":"4. การตรวจสอบความพร้อมของวัตถุดิบ","k":"p"},{"t":"5. การจัดทำแผนการผลิตเบื้องต้น","k":"p"},{"t":"การศึกษาครั้งนี้ไม่ครอบคลุมการพัฒนาระบบบัญชีและการเงิน การจัดซื้อ การบริหารคลังสินค้าเต็มรูปแบบ การควบคุมเครื่องจักรในกระบวนการผลิตจริง และโมดูลอื่นของ ERP ที่อยู่นอกกระบวนการที่ศึกษา","k":"p"},{"t":"1.6.2 ขอบเขตด้านพื้นที่","k":"h"},{"t":"การศึกษาดำเนินการในโรงพิมพ์แห่งหนึ่งในประเทศไทยซึ่งใช้เป็นกรณีศึกษา โดยไม่เปิดเผยชื่อองค์การเพื่อรักษาความลับของข้อมูลทางธุรกิจและข้อมูลการดำเนินงาน","k":"p"},{"t":"1.6.3 ขอบเขตด้านประชากร กลุ่มตัวอย่าง และหน่วยวิเคราะห์","k":"h"},{"t":"ประชากรของการวิจัยประกอบด้วยผู้บริหาร หัวหน้างาน และบุคลากรที่เกี่ยวข้องกับกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"กลุ่มผู้ให้ข้อมูลและผู้ประเมินประกอบด้วยผู้เชี่ยวชาญจำนวน 10 คน และผู้ใช้งานระบบจำนวน 20 คน ซึ่งคัดเลือกแบบเจาะจง (Purposive Sampling) ตามคุณสมบัติที่กำหนดในการวิจัย","k":"p"},{"t":"การวิจัยแยกหน่วยข้อมูลตามวัตถุประสงค์ของการประเมิน โดยข้อมูลระดับบุคคลใช้สำหรับการศึกษาความต้องการ การประเมินความเหมาะสมของระบบ และการประเมินความพึงพอใจของผู้ใช้งาน ส่วนข้อมูลระดับงาน (Job-level) ใช้ในการเปรียบเทียบผลการดำเนินงานก่อนและหลังการใช้ระบบ ได้แก่ เวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต และเวลาในการจัดทำแผนการผลิต","k":"p"},{"t":"1.6.4 ขอบเขตด้านเวลา","k":"h"},{"t":"การดำเนินการวิจัยครอบคลุมระยะเวลา 12 สัปดาห์ ตั้งแต่การศึกษาสภาพปัญหาและความต้องการ การออกแบบและพัฒนาระบบ การทดสอบและปรับปรุงระบบ การทดลองใช้ จนถึงการเก็บรวบรวมและวิเคราะห์ข้อมูลเพื่อประเมินผลระบบ","k":"p"}],"no":"1.6","pdf":15,"pdfEnd":15,"book":6,"bookEnd":6,"toc":6,"cites":[],"q":"ขอบเขตด้านเนื้อหา พื้นที่ ประชากร และเวลา กำหนดไว้ชัดเจนหรือไม่","fd":[]},{"id":"c1-7","title":"1.7 ประโยชน์ที่คาดว่าจะได้รับ","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"1. ด้านวิชาการ ได้ข้อค้นพบเกี่ยวกับการประยุกต์ใช้ AI Agent ร่วมกับ ERP เพื่อสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตในบริบทของโรงพิมพ์กรณีศึกษา รวมทั้งแนวทางในการเชื่อมโยงข้อมูล กระบวนการ และความรู้ของผู้ปฏิบัติงานในการพัฒนาระบบ","k":"p"},{"t":"2. ด้านการบริหารและการปฏิบัติงาน ได้ข้อมูลสำหรับประกอบการปรับปรุงกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต รวมถึงการลดการพึ่งพาการรวบรวมและประมวลผลข้อมูลด้วยวิธีการเดิม","k":"p"},{"t":"3. ด้านการจัดการความรู้ ได้แนวทางในการถ่ายทอดความรู้และประสบการณ์ของบุคลากรให้อยู่ในรูปของกฎ สูตร เงื่อนไข และกระบวนการที่สามารถนำมาใช้ร่วมกับระบบสารสนเทศได้","k":"p"},{"t":"4. ด้านการพัฒนาระบบสารสนเทศ ได้ระบบต้นแบบ AI Agent ERP และแนวทางในการบูรณาการ AI Agent ข้อมูลจาก ERP กฎทางธุรกิจ และกลไก Human-in-the-loop ภายใต้กระบวนการปฏิบัติงานจริง","k":"p"},{"t":"5. ด้านการประยุกต์ใช้ ผลการศึกษาสามารถใช้เป็นข้อมูลประกอบสำหรับการศึกษาและการประยุกต์ใช้ในองค์กรที่มีกระบวนการทำงานใกล้เคียงกัน โดยต้องคำนึงถึงความแตกต่างด้านข้อมูล กระบวนการ บุคลากร และระบบสารสนเทศของแต่ละองค์กร","k":"p"}],"no":"1.7","pdf":16,"pdfEnd":16,"book":7,"bookEnd":7,"toc":7,"cites":[],"q":"ประโยชน์ที่คาดว่าจะได้รับเป็นรูปธรรมและสอดคล้องกับวัตถุประสงค์หรือไม่","fd":[{"lv":"ตรวจ","t":"ไม่พบแผนการเผยแพร่ผลงาน เช่น บทความวารสารหรือการนำเสนอในการประชุมวิชาการ"}]},{"id":"c1-8","title":"1.8 นิยามศัพท์เฉพาะ","group":"บทที่ 1 บทนำ","ch":1,"paras":[{"t":"1. ปัญญาประดิษฐ์แบบเอเจนต์ (AI Agent) หมายถึง ระบบซอฟต์แวร์ที่สามารถรับข้อมูลหรือคำสั่ง ตรวจสอบข้อมูลที่จำเป็น ประมวลผลตามกฎหรือเงื่อนไขที่กำหนด เรียกใช้ข้อมูลหรือฟังก์ชันที่ได้รับอนุญาต และนำเสนอผลลัพธ์เพื่อสนับสนุนการดำเนินงานของผู้ใช้งานภายใต้ขอบเขตที่กำหนดในการวิจัยครั้งนี้","k":"p"},{"t":"2. ระบบ AI Agent ERP หมายถึง ระบบต้นแบบที่พัฒนาขึ้นในการวิจัยครั้งนี้ โดยเชื่อมการทำงานของ AI Agent กับข้อมูลและฟังก์ชันที่เกี่ยวข้องของ ERP เพื่อสนับสนุนการรับและตรวจสอบข้อกำหนดของงาน การเสนอราคา การตรวจสอบความพร้อมของวัตถุดิบ และการจัดทำแผนการผลิตเบื้องต้น โดยมีผู้ใช้งานตรวจสอบและยืนยันผลลัพธ์ตามกลไก Human-in-the-loop","k":"p"},{"t":"3. ระบบวางแผนทรัพยากรองค์กร (Enterprise Resource Planning: ERP) หมายถึง ระบบสารสนเทศที่ใช้เชื่อมโยงข้อมูลและกระบวนการดำเนินงานของหน่วยงานต่าง ๆ ภายในองค์การ เพื่อสนับสนุนการใช้ข้อมูลร่วมกันในการปฏิบัติงานและการตัดสินใจ","k":"p"},{"t":"4. กระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต หมายถึง กระบวนการตั้งแต่การรับข้อกำหนดของงาน การตรวจสอบข้อมูล การเรียกใช้ข้อมูลลูกค้าและต้นทุน การคำนวณและจัดทำข้อเสนอราคา การตรวจสอบความพร้อมของวัตถุดิบ จนถึงการจัดทำแผนการผลิตเบื้องต้น","k":"p"},{"t":"5. ความรู้ฝังลึก (Tacit Knowledge) หมายถึง ความรู้ ทักษะ ประสบการณ์ และวิจารณญาณที่สะสมอยู่ในตัวบุคคลจากการปฏิบัติงาน ซึ่งยังมิได้ถูกถ่ายทอดหรือบันทึกให้อยู่ในรูปแบบที่สามารถนำมาใช้โดยระบบได้โดยตรง","k":"p"},{"t":"6. ความรู้ชัดแจ้ง (Explicit Knowledge) หมายถึง ความรู้ที่ได้รับการถ่ายทอดหรือบันทึกให้อยู่ในรูปแบบที่สามารถสื่อสาร จัดเก็บ และนำกลับมาใช้ได้ เช่น กฎ สูตร เงื่อนไข ขั้นตอน และเอกสาร","k":"p"},{"t":"7. แบบจำลอง SECI หมายถึง กรอบแนวคิดของ Nonaka และ Takeuchi (1995) ที่ใช้อธิบายกระบวนการสร้างและเปลี่ยนแปลงความรู้ระหว่างความรู้ฝังลึกและความรู้ชัดแจ้ง ผ่านกระบวนการ Socialization, Externalization, Combination และ Internalization","k":"p"},{"t":"8. ความถูกต้องของข้อมูลคำสั่งผลิต หมายถึง ค่าร้อยละที่สะท้อนความถูกต้องของข้อมูลคำสั่งผลิตตามเกณฑ์ที่กำหนดในการวิจัย โดยพิจารณาจากข้อมูลจำนวน วัสดุ ราคา และกำหนดส่งมอบตามแบบบันทึกผลการทดลอง","k":"p"},{"t":"9. เวลาในการออกใบเสนอราคา หมายถึง ระยะเวลาตั้งแต่เริ่มรับข้อมูลที่จำเป็นสำหรับการจัดทำใบเสนอราคาจนถึงได้ใบเสนอราคาฉบับแรกตามเกณฑ์ที่กำหนดในการวิจัย มีหน่วยเป็นนาทีต่อรายการ","k":"p"},{"t":"10. เวลาในการจัดทำแผนการผลิต หมายถึง ระยะเวลาตั้งแต่เริ่มดำเนินการจัดทำแผนการผลิตจนถึงได้แผนการผลิตเบื้องต้นที่พร้อมให้ผู้เกี่ยวข้องตรวจสอบตามเกณฑ์ที่กำหนดในการวิจัย มีหน่วยเป็นนาทีต่อรายการ","k":"p"},{"t":"11. ความเหมาะสมของระบบ หมายถึง ระดับความคิดเห็นของผู้เชี่ยวชาญที่มีต่อระบบต้นแบบในด้านการทำงานของระบบ ความง่ายในการใช้งาน ความถูกต้อง และประสิทธิภาพ ซึ่งวัดด้วยแบบประเมินมาตรประมาณค่า 5 ระดับ","k":"p"},{"t":"12. ความพึงพอใจของผู้ใช้งาน หมายถึง ระดับความคิดเห็นของผู้ใช้งานภายหลังการทดลองใช้ระบบต้นแบบ ซึ่งวัดด้วยแบบสอบถามมาตรประมาณค่า 5 ระดับ ครอบคลุมด้านความรวดเร็ว ความถูกต้อง ความง่ายในการใช้งาน ประโยชน์ที่ได้รับ และความพึงพอใจโดยรวม","k":"p"}],"no":"1.8","pdf":16,"pdfEnd":17,"book":7,"bookEnd":8,"toc":8,"cites":[4],"q":"นิยามศัพท์เฉพาะเป็นนิยามเชิงปฏิบัติการที่วัดได้หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 8 แต่หัวข้อนี้เริ่มจริงที่หน้า 7"}]},{"id":"c2-0","title":"เกริ่นนำบทที่ 2","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"การวิจัยเรื่อง “การพัฒนาระบบเอไอเอเจนต์อีอาร์พีเพื่อเพิ่มประสิทธิภาพการเสนอราคาและการวางแผนผลิตในอุตสาหกรรมพิมพ์บรรจุภัณฑ์” มีวัตถุประสงค์เพื่อศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ ออกแบบและพัฒนาระบบต้นแบบ และประเมินความเหมาะสมรวมถึงผลการใช้งานระบบในกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต","k":"p"},{"t":"ผู้วิจัยได้ศึกษาแนวคิด ทฤษฎี เอกสาร และงานวิจัยที่เกี่ยวข้อง เพื่อใช้เป็นพื้นฐานในการวิเคราะห์ปัญหา ออกแบบและพัฒนาระบบ และกำหนดกรอบแนวคิดการวิจัย โดยแบ่งเนื้อหาออกเป็น 8 ส่วน ดังนี้","k":"p"},{"t":"1. แนวคิดเกี่ยวกับการจัดการงานพิมพ์และกระบวนการผลิตตามคำสั่ง","k":"p"},{"t":"2. แนวคิดเกี่ยวกับระบบวางแผนทรัพยากรองค์กร","k":"p"},{"t":"3. แนวคิดเกี่ยวกับปัญญาประดิษฐ์แบบเอเจนต์","k":"p"},{"t":"4. แนวคิดเกี่ยวกับการจัดการความรู้และแบบจำลอง SECI","k":"p"},{"t":"5. แนวคิดองค์การในฐานะระบบเปิดและการบริหารการพัฒนา","k":"p"},{"t":"6. การบูรณาการ AI Agent ERP กับกระบวนการของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"7. งานวิจัยที่เกี่ยวข้องและช่องว่างการวิจัย","k":"p"},{"t":"8. กรอบแนวคิดการวิจัย","k":"p"}],"pdf":18,"pdfEnd":18,"book":9,"bookEnd":9,"toc":9,"cites":[],"q":"บทที่ 2 วางโครงเนื้อหาไว้อย่างไร และครอบคลุมตัวแปรในกรอบแนวคิดหรือไม่","fd":[{"lv":"ตรวจ","t":"บทนี้เริ่มต่อท้ายหน้าเดิม ไม่ขึ้นหน้าใหม่ ควรตรวจกับรูปแบบเล่มของบัณฑิตวิทยาลัย"}]},{"id":"c2-1","title":"2.1 แนวคิดเกี่ยวกับการจัดการงานพิมพ์และกระบวนการผลิตตามคำสั่ง","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"2.1.1 ลักษณะของการผลิตตามคำสั่ง","k":"h"},{"t":"การดำเนินงานของโรงพิมพ์มีลักษณะสำคัญของการผลิตตามคำสั่ง (Job Order Production) กล่าวคือ งานแต่ละรายการได้รับการผลิตตามความต้องการและข้อกำหนดของลูกค้า จึงมีความแตกต่างกันในด้านประเภทวัสดุ ขนาด จำนวนพิมพ์ จำนวนสี รูปแบบการพิมพ์ กระบวนการหลังพิมพ์ และกำหนดส่งมอบ","k":"p"},{"t":"ความแตกต่างดังกล่าวทำให้การดำเนินงานของโรงพิมพ์ต้องใช้ข้อมูลหลายประเภทประกอบกัน ตั้งแต่ข้อมูลความต้องการของลูกค้า ราคาวัตถุดิบ ต้นทุนการผลิต ข้อมูลเครื่องจักร ความพร้อมของวัตถุดิบ กำลังการผลิต และระยะเวลาส่งมอบ","k":"p"},{"t":"กระบวนการตั้งแต่การรับความต้องการของลูกค้าจนถึงการวางแผนการผลิตจึงเป็นกระบวนการที่เชื่อมโยงหลายหน่วยงาน การเปลี่ยนแปลงข้อมูล เช่น ชนิดวัสดุ จำนวนผลิต หรือกำหนดส่งมอบ สามารถส่งผลต่อการคำนวณต้นทุน ราคา และแผนการผลิตได้","k":"p"},{"t":"2.1.2 การรับงานและการตรวจสอบข้อกำหนด","k":"h"},{"t":"การรับงานเป็นจุดเริ่มต้นของกระบวนการ โดยผู้ปฏิบัติงานต้องรวบรวมและตรวจสอบข้อมูลที่จำเป็น ได้แก่ ข้อมูลลูกค้า ประเภทงาน ขนาด จำนวน วัสดุ จำนวนสี กระบวนการผลิต กระบวนการหลังพิมพ์ และกำหนดส่งมอบ","k":"p"},{"t":"ความครบถ้วนและความถูกต้องของข้อมูลในขั้นตอนนี้มีผลต่อการคำนวณต้นทุน การจัดทำใบเสนอราคา การจัดทำคำสั่งผลิต และการวางแผนการผลิต ดังนั้น ระบบที่สนับสนุนกระบวนการรับงานควรสามารถตรวจสอบข้อมูลที่จำเป็น ระบุข้อมูลที่ไม่ครบถ้วน และลดการส่งต่อข้อมูลที่คลาดเคลื่อนไปยังขั้นตอนต่อไป","k":"p"},{"t":"2.1.3 การคำนวณต้นทุนและการเสนอราคา","k":"h"},{"t":"การเสนอราคาในธุรกิจการพิมพ์จำเป็นต้องพิจารณาต้นทุนที่เกี่ยวข้องกับงานแต่ละรายการ เช่น ต้นทุนวัตถุดิบ ต้นทุนเครื่องจักร ค่าเตรียมงาน ความสูญเสียในกระบวนการ ค่าแรง กระบวนการหลังพิมพ์ ค่าใช้จ่ายที่เกี่ยวข้อง และอัตรากำไรตามเกณฑ์ขององค์การ","k":"p"},{"t":"ในเชิงโครงสร้างสามารถอธิบายได้ว่า","k":"p"},{"t":"ต้นทุนรวม = ต้นทุนวัตถุดิบ + ต้นทุนเครื่องจักร + ค่าเตรียมงาน + ต้นทุนความสูญเสีย + ต้นทุนกระบวนการหลังพิมพ์ + ค่าใช้จ่ายอื่นที่เกี่ยวข้อง","k":"p"},{"t":"จากนั้นจึงนำต้นทุนรวมไปใช้ประกอบการกำหนดราคาเสนอขายตามเกณฑ์ขององค์การ","k":"p"},{"t":"อย่างไรก็ตาม งานพิมพ์แต่ละประเภทมิได้มีโครงสร้างต้นทุนเหมือนกันทั้งหมด การพัฒนาระบบในการวิจัยครั้งนี้จึงใช้ข้อมูลต้นทุน สูตรคำนวณ และกฎทางธุรกิจที่สอดคล้องกับกระบวนการจริงของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"2.1.4 การวางแผนการผลิต","k":"h"},{"t":"การวางแผนการผลิตเป็นกระบวนการจัดสรรทรัพยากรให้เหมาะสมกับข้อกำหนดของงาน โดยต้องพิจารณาความพร้อมของวัตถุดิบ ความสามารถของเครื่องจักร ลำดับงาน ระยะเวลาในการผลิต และกำหนดส่งมอบ","k":"p"},{"t":"ในการวิจัยครั้งนี้ ระบบ AI Agent ERP ทำหน้าที่สนับสนุนการจัดทำแผนการผลิตเบื้องต้นจากข้อมูลและเงื่อนไขที่กำหนด มิได้ทำหน้าที่ควบคุมเครื่องจักรหรือกระบวนการผลิตจริงโดยอัตโนมัติ การตรวจสอบและยืนยันแผนการผลิตยังคงเป็นหน้าที่ของบุคลากรที่เกี่ยวข้อง","k":"p"}],"no":"2.1","pdf":19,"pdfEnd":19,"book":10,"bookEnd":10,"toc":10,"cites":[],"q":"แนวคิดการจัดการงานพิมพ์และการผลิตตามคำสั่ง อธิบายบริบทของงานวิจัยได้เพียงพอหรือไม่","fd":[]},{"id":"c2-2","title":"2.2 แนวคิดเกี่ยวกับระบบวางแผนทรัพยากรองค์กร","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"2.2.1 ความหมายและลักษณะของ ERP","k":"h"},{"t":"ระบบวางแผนทรัพยากรองค์กร (Enterprise Resource Planning: ERP) เป็นระบบสารสนเทศที่ใช้เชื่อมโยงข้อมูลและกระบวนการของหน่วยงานต่าง ๆ ภายในองค์การ เพื่อให้ข้อมูลสามารถใช้ร่วมกัน ลดความซ้ำซ้อน และสนับสนุนการดำเนินงานและการตัดสินใจ","k":"p"},{"t":"2.2.2 ERP กับกระบวนการของโรงพิมพ์","k":"h"},{"t":"ERP สามารถทำหน้าที่เป็นแหล่งข้อมูลสำหรับข้อมูลลูกค้า วัตถุดิบ ต้นทุน สินค้าคงเหลือ คำสั่งผลิต และข้อมูลที่เกี่ยวข้องกับการวางแผนการผลิต อย่างไรก็ตาม การมีข้อมูลอยู่ใน ERP ไม่ได้ทำให้ข้อมูลจากหลายส่วนถูกนำมาประมวลผลตามเงื่อนไขของแต่ละงานโดยอัตโนมัติ ผู้ปฏิบัติงานยังต้องค้นหา ตรวจสอบ และเชื่อมโยงข้อมูลก่อนนำไปใช้","k":"p"},{"t":"การวิจัยครั้งนี้จึงไม่ได้มุ่งพัฒนา ERP ขึ้นใหม่ทั้งระบบ แต่พัฒนา AI Agent เพื่อทำงานร่วมกับข้อมูลและฟังก์ชันที่เกี่ยวข้องของ ERP ภายใต้ขอบเขตการรับงาน การเสนอราคา และการวางแผนการผลิต","k":"p"},{"t":"2.2.3 บทบาทของ ERP ในระบบต้นแบบ","k":"h"},{"t":"ในระบบที่พัฒนาขึ้น ERP ทำหน้าที่เป็นโครงสร้างพื้นฐานด้านข้อมูลและธุรกรรม ขณะที่ AI Agent ทำหน้าที่สนับสนุนการประสานข้อมูล การประมวลผล และการเรียกใช้เครื่องมือหรือฟังก์ชันที่เกี่ยวข้อง","k":"p"},{"t":"สามารถสรุปกระบวนการได้ดังนี้","k":"p"},{"t":"ผู้ใช้งาน → AI Agent → กฎทางธุรกิจ/เครื่องมือคำนวณ → ERP/ฐานข้อมูล → การประมวลผล → ผู้ใช้งานตรวจสอบและยืนยัน","k":"p"},{"t":"แนวทางดังกล่าวทำให้บทบาทของ AI Agent, ERP และบุคลากรมีความแตกต่างกันอย่างชัดเจน และช่วยลดความเสี่ยงจากการให้ระบบ AI ดำเนินการโดยไม่มีการตรวจสอบ","k":"p"}],"no":"2.2","pdf":20,"pdfEnd":21,"book":11,"bookEnd":12,"toc":12,"cites":[],"q":"แนวคิดระบบวางแผนทรัพยากรองค์กรมีแหล่งอ้างอิงรองรับ และเชื่อมกับระบบต้นแบบอย่างไร","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 12 แต่หัวข้อนี้เริ่มจริงที่หน้า 11"}]},{"id":"c2-3","title":"2.3 แนวคิดเกี่ยวกับปัญญาประดิษฐ์แบบเอเจนต์","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"2.3.1 ความหมายของ AI Agent","k":"h"},{"t":"Russell และ Norvig (2021) อธิบาย Intelligent Agent ในลักษณะของระบบที่รับรู้สภาพแวดล้อมและดำเนินการต่อสภาพแวดล้อมเพื่อบรรลุวัตถุประสงค์","k":"p"},{"t":"สำหรับการวิจัยครั้งนี้ AI Agent หมายถึงระบบซอฟต์แวร์ที่สามารถรับข้อมูลจากผู้ใช้งาน ตรวจสอบข้อมูลที่จำเป็น เรียกใช้ข้อมูลหรือฟังก์ชันที่ได้รับอนุญาต ประมวลผลตามกฎและเงื่อนไขทางธุรกิจ และนำเสนอผลลัพธ์เพื่อสนับสนุนการปฏิบัติงาน","k":"p"},{"t":"2.3.2 องค์ประกอบของ AI Agent","k":"h"},{"t":"องค์ประกอบที่นำมาใช้ในการออกแบบระบบประกอบด้วย","k":"p"},{"t":"Input/Perception สำหรับรับข้อมูลหรือรายละเอียดของงาน","k":"li"},{"t":"Interpretation สำหรับตรวจสอบความหมายและความครบถ้วนของข้อมูล","k":"li"},{"t":"Reasoning and Business Rules สำหรับประมวลผลตามกฎและเงื่อนไขทางธุรกิจ","k":"li"},{"t":"Tool and Data Access สำหรับเรียกใช้ข้อมูลและฟังก์ชันที่ได้รับอนุญาตจาก ERP หรือฐานข้อมูล","k":"li"},{"t":"Action/Output สำหรับจัดทำผลลัพธ์ เช่น ข้อมูลสำหรับเสนอราคา ผลการตรวจสอบวัตถุดิบ หรือแผนการผลิตเบื้องต้น","k":"li"},{"t":"Human Validation สำหรับให้ผู้ใช้งานตรวจสอบและยืนยันผลลัพธ์ก่อนนำไปใช้","k":"li"},{"t":"2.3.3 AI Agent และการเรียกใช้เครื่องมือ","k":"h"},{"t":"แนวคิด AI Agent แตกต่างจากการใช้แบบจำลองภาษาเพื่อสร้างข้อความเพียงอย่างเดียว เนื่องจาก Agent สามารถถูกออกแบบให้ทำงานหลายขั้นตอน เรียกใช้เครื่องมือ เข้าถึงข้อมูลที่ได้รับอนุญาต และดำเนินการตามเงื่อนไขที่กำหนด","k":"p"},{"t":"Yao และคณะ (2023) เสนอแนวคิด ReAct ซึ่งผสานการให้เหตุผลกับการดำเนินการ ขณะที่ Schick และคณะ (2023) แสดงให้เห็นความสามารถของแบบจำลองภาษาในการเรียกใช้เครื่องมือภายนอก","k":"p"},{"t":"ในการศึกษาครั้งนี้ AI Agent จึงทำงานร่วมกับ ERP เครื่องมือคำนวณ กฎทางธุรกิจ และฐานความรู้ มิได้ใช้แบบจำลองภาษาเป็นผู้คำนวณหรือตัดสินผลลัพธ์สำคัญโดยลำพัง","k":"p"},{"t":"2.3.4 Human-in-the-loop","k":"h"},{"t":"กระบวนการเสนอราคา ข้อมูลคำสั่งผลิต และการวางแผนการผลิตเป็นกระบวนการที่ผลลัพธ์สามารถส่งผลต่อการดำเนินงานขององค์การ การวิจัยจึงกำหนด Human-in-the-loop เป็นส่วนหนึ่งของระบบ","k":"p"},{"t":"AI Agent สามารถตรวจสอบ ประมวลผล และจัดทำข้อเสนอเบื้องต้น แต่ผลลัพธ์สำคัญยังต้องผ่านการตรวจสอบหรือยืนยันโดยผู้ใช้งานก่อนนำไปใช้ในกระบวนการต่อไป","k":"p"}],"no":"2.3","pdf":22,"pdfEnd":22,"book":13,"bookEnd":13,"toc":13,"cites":[7,11,8],"q":"แนวคิดปัญญาประดิษฐ์แบบเอเจนต์อ้างอิงงานวิชาการที่น่าเชื่อถือหรือไม่","fd":[]},{"id":"c2-4","title":"2.4 แนวคิดเกี่ยวกับการจัดการความรู้และแบบจำลอง SECI","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"2.4.1 ความรู้ในองค์การ","k":"h"},{"t":"ความรู้ขององค์การสามารถจำแนกเป็นความรู้ฝังลึก (Tacit Knowledge) และความรู้ชัดแจ้ง (Explicit Knowledge)","k":"p"},{"t":"ความรู้ฝังลึกเป็นความรู้ที่เกิดจากประสบการณ์ ทักษะ และวิจารณญาณของบุคคล ส่วนความรู้ชัดแจ้งเป็นความรู้ที่สามารถบันทึก ถ่ายทอด จัดเก็บ และนำกลับมาใช้ได้ เช่น สูตร กฎ เงื่อนไข และขั้นตอนการปฏิบัติงาน","k":"p"},{"t":"ในโรงพิมพ์กรณีศึกษา ความรู้เกี่ยวกับการประเมินต้นทุน การเลือกวัสดุ การพิจารณากระบวนการผลิต และการจัดลำดับงานบางส่วนอยู่ในประสบการณ์ของผู้ปฏิบัติงาน การพัฒนาระบบจึงต้องมีกระบวนการรวบรวมและจัดโครงสร้างความรู้ดังกล่าวก่อนนำมาใช้กับระบบ","k":"p"},{"t":"2.4.2 แบบจำลอง SECI","k":"h"},{"t":"Nonaka และ Takeuchi (1995) เสนอแบบจำลอง SECI ซึ่งอธิบายการสร้างและเปลี่ยนแปลงความรู้ 4 รูปแบบ ได้แก่","k":"p"},{"t":"Socialization (Tacit → Tacit) การแลกเปลี่ยนประสบการณ์ระหว่างบุคคล","k":"li"},{"t":"Externalization (Tacit → Explicit) การถ่ายทอดความรู้และประสบการณ์ออกมาเป็นกฎ สูตร ขั้นตอน หรือเงื่อนไข","k":"li"},{"t":"Combination (Explicit → Explicit) การเชื่อมโยงและจัดระบบความรู้ชัดแจ้งจากหลายแหล่ง","k":"li"},{"t":"Internalization (Explicit → Tacit) การนำความรู้ที่จัดระบบแล้วไปใช้ในการปฏิบัติงานจนเกิดความรู้และประสบการณ์ใหม่","k":"li"},{"t":"2.4.3 การประยุกต์ SECI ในการวิจัย","k":"h"},{"t":"ตารางที่ 2.1 การประยุกต์แบบจำลอง SECI","k":"cap"},{"t":"กระบวนการ การประยุกต์ในการวิจัย","k":"row"},{"t":"Socialization ศึกษาและแลกเปลี่ยนประสบการณ์กับบุคลากรที่เกี่ยวข้อง","k":"row"},{"t":"Externalization ถ่ายทอดความรู้เป็นกฎ สูตร เงื่อนไข และขั้นตอน","k":"row"},{"t":"Combination เชื่อมโยงกฎและความรู้กับข้อมูล ERP และข้อมูลต้นทุน","k":"row"},{"t":"Internalization ผู้ใช้งานนำระบบต้นแบบไปใช้ในการปฏิบัติงาน","k":"row"},{"t":"ในการวิจัยครั้งนี้ SECI ใช้เป็นกรอบอธิบายกระบวนการจัดการความรู้ที่เกี่ยวข้องกับการพัฒนาระบบ มิได้กำหนดเป็นตัวแปรสำหรับการทดสอบสมมติฐานทางสถิติ","k":"p"}],"no":"2.4","pdf":23,"pdfEnd":23,"book":14,"bookEnd":14,"toc":15,"cites":[4],"q":"แบบจำลอง SECI ถูกนำมาประยุกต์กับการวิจัยอย่างไร","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 15 แต่หัวข้อนี้เริ่มจริงที่หน้า 14"}]},{"id":"c2-5","title":"2.5 แนวคิดองค์การในฐานะระบบเปิดและการบริหารการพัฒนา","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"การมององค์การในฐานะระบบเปิดช่วยอธิบายความสัมพันธ์ระหว่างองค์ประกอบต่าง ๆ ขององค์การ โดยองค์การรับปัจจัยนำเข้า (Input) ผ่านกระบวนการดำเนินงาน (Process) ก่อให้เกิดผลผลิต (Output) และใช้ข้อมูลย้อนกลับ (Feedback) เพื่อปรับปรุงการดำเนินงาน","k":"p"},{"t":"เมื่อนำมาประยุกต์กับการศึกษาครั้งนี้ สามารถอธิบายได้ดังนี้","k":"p"},{"t":"Input: ข้อกำหนดของลูกค้า ข้อมูลต้นทุน ราคาวัตถุดิบ ข้อมูลเครื่องจักร ความพร้อมของวัตถุดิบ และกำลังการผลิต","k":"li"},{"t":"Process: การตรวจสอบข้อมูล การคำนวณต้นทุน การจัดทำราคา การตรวจสอบวัตถุดิบ และการจัดทำแผนการผลิต","k":"li"},{"t":"Output: ใบเสนอราคา ข้อมูลคำสั่งผลิต และแผนการผลิตเบื้องต้น","k":"li"},{"t":"Feedback: ผลการปฏิบัติงาน ความคลาดเคลื่อน การแก้ไขข้อมูล และความคิดเห็นของผู้ใช้งาน","k":"li"},{"t":"ในมิติของการบริหารการพัฒนา การพัฒนาระบบ AI Agent ERP จึงไม่ได้พิจารณาเฉพาะการนำเทคโนโลยีมาใช้ แต่พิจารณาการพัฒนาความสามารถขององค์การผ่านความสัมพันธ์ระหว่างบุคลากร กระบวนการ ข้อมูล ความรู้ และเทคโนโลยี","k":"p"},{"t":"ผลของการพัฒนาได้รับการประเมินผ่านตัวชี้วัดที่กำหนด ได้แก่ เวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต เวลาในการจัดทำแผนการผลิต ความเหมาะสมของระบบ และความพึงพอใจของผู้ใช้งาน","k":"p"}],"no":"2.5","pdf":24,"pdfEnd":24,"book":15,"bookEnd":15,"toc":16,"cites":[],"q":"แนวคิดองค์การระบบเปิดเชื่อมกับสาขาการบริหารการพัฒนาอย่างไร","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 16 แต่หัวข้อนี้เริ่มจริงที่หน้า 15"}]},{"id":"c2-6","title":"2.6 การบูรณาการ AI Agent ERP กับกระบวนการของโรงพิมพ์กรณีศึกษา","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"จากแนวคิดที่กล่าวมา การวิจัยกำหนดให้ระบบต้นแบบบูรณาการ AI Agent เข้ากับ ERP กฎทางธุรกิจ และความรู้ของผู้ปฏิบัติงาน เพื่อสนับสนุนกระบวนการต้นน้ำของโรงพิมพ์","k":"p"},{"t":"กระบวนการหลักประกอบด้วย","k":"p"},{"t":"รับข้อกำหนดงาน → ตรวจสอบความครบถ้วน → เรียกใช้ข้อมูล ERP → ประมวลผลตามกฎทางธุรกิจ → จัดทำข้อมูลสำหรับเสนอราคา → ตรวจสอบความพร้อมของวัตถุดิบ → จัดทำแผนการผลิตเบื้องต้น → ผู้ใช้งานตรวจสอบและยืนยัน","k":"p"},{"t":"ระบบต้นแบบประกอบด้วย 5 โมดูล ได้แก่","k":"p"},{"t":"1. Order Intake and Specification Module สำหรับรับและตรวจสอบข้อกำหนดของงาน","k":"p"},{"t":"2. Quotation Generator Module สำหรับเรียกใช้ข้อมูลต้นทุนและประมวลผลตามสูตรและกฎที่กำหนด","k":"p"},{"t":"3. Material Availability Module สำหรับตรวจสอบความพร้อมของวัตถุดิบ","k":"p"},{"t":"4. Production Planning Module สำหรับจัดทำแผนการผลิตเบื้องต้น","k":"p"},{"t":"5. Human-in-the-loop Module สำหรับให้ผู้ใช้งานตรวจสอบ ยืนยัน หรือแก้ไขผลลัพธ์","k":"p"},{"t":"องค์ประกอบดังกล่าวเชื่อมโยงโดยตรงกับการออกแบบและพัฒนาระบบตามวัตถุประสงค์การวิจัยข้อที่ 2","k":"p"}],"no":"2.6","pdf":25,"pdfEnd":25,"book":16,"bookEnd":16,"toc":17,"cites":[],"q":"การบูรณาการระบบกับกระบวนการของโรงพิมพ์อธิบายเป็นลำดับขั้นชัดเจนหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 17 แต่หัวข้อนี้เริ่มจริงที่หน้า 16"}]},{"id":"c2-7","title":"2.7 งานวิจัยที่เกี่ยวข้องและช่องว่างการวิจัย","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"2.7.1 งานศึกษาด้าน ERP การบูรณาการกระบวนการ และการผลิต","k":"h"},{"t":"O’Leary (2000) อธิบายว่า ERP ช่วยรวมข้อมูล สนับสนุนการประมวลผลธุรกรรม และเชื่อมโยงข้อมูลระหว่างหน่วยงานเพื่อการวางแผนและการตัดสินใจ ขณะที่ AboAbdo, Aldhoiena และ Al-Amrib (2019) ชี้ให้เห็นความสำคัญของปัจจัยด้านข้อมูล กระบวนการ การสนับสนุนจากผู้บริหาร และการมีส่วนร่วมของผู้ใช้ในการนำ ERP ไปใช้","k":"p"},{"t":"ในด้านการผลิต Kusiak (2018) อธิบายบทบาทของเทคโนโลยีและข้อมูลใน Smart Manufacturing ซึ่งช่วยสนับสนุนการตัดสินใจและเพิ่มประสิทธิภาพการดำเนินงาน","k":"p"},{"t":"ข้อค้นพบเหล่านี้สนับสนุนแนวทางของการวิจัยครั้งนี้ในการใช้ ERP เป็นโครงสร้างพื้นฐานด้านข้อมูล และพัฒนา AI Agent เป็นขั้นสนับสนุนการประสานข้อมูลและการประมวลผลตามกฎทางธุรกิจ","k":"p"},{"t":"2.7.2 งานศึกษาด้าน AI Agent และการใช้เครื่องมือ","k":"h"},{"t":"Russell และ Norvig (2021) วางพื้นฐานแนวคิด Intelligent Agent ในฐานะระบบที่รับรู้และดำเนินการเพื่อบรรลุวัตถุประสงค์","k":"p"},{"t":"Yao และคณะ (2023) เสนอ ReAct ซึ่งเชื่อมโยงการให้เหตุผลกับการดำเนินการ ส่วน Schick และคณะ (2023) แสดงแนวทางที่แบบจำลองภาษาสามารถเรียนรู้การเรียกใช้เครื่องมือภายนอก","k":"p"},{"t":"งานสำรวจของ Xi และคณะ (2023) และ Wang และคณะ (2024) แสดงให้เห็นองค์ประกอบและแนวโน้มของระบบที่ใช้แบบจำลองภาษาขนาดใหญ่เป็นพื้นฐานของ Agent ซึ่งครอบคลุมการวางแผน การใช้เครื่องมือ ความจำ และการดำเนินงานหลายขั้นตอน","k":"p"},{"t":"แนวคิดดังกล่าวนำมาใช้ในการออกแบบ AI Agent ของการวิจัยครั้งนี้ โดยกำหนดให้ Agent สามารถประสานการทำงานกับข้อมูล ERP เครื่องมือคำนวณ และกฎทางธุรกิจ ภายใต้สิทธิ์และขอบเขตที่กำหนด","k":"p"},{"t":"2.7.3 งานศึกษาด้านการกำกับดูแลและการควบคุม AI","k":"h"},{"t":"NIST (2023) เสนอ Artificial Intelligence Risk Management Framework ซึ่งให้ความสำคัญกับการกำกับดูแล การทำความเข้าใจความเสี่ยง การวัด และการจัดการความเสี่ยงของระบบ AI","k":"p"},{"t":"ISO/IEC 42001:2023 ให้กรอบสำหรับระบบการจัดการปัญญาประดิษฐ์ในระดับองค์การ โดยให้ความสำคัญกับการกำกับดูแล ความรับผิดชอบ การจัดการความเสี่ยง และการปรับปรุงอย่างต่อเนื่อง","k":"p"},{"t":"แนวคิดดังกล่าวนำมาใช้ประกอบการกำหนดกลไกควบคุมของระบบต้นแบบ ได้แก่ การใช้กฎทางธุรกิจสำหรับการคำนวณที่สำคัญ การกำหนดสิทธิ์การเข้าถึง การบันทึกผล และ Human-in-the-loop","k":"p"},{"t":"2.7.4 งานศึกษาด้านการจัดการความรู้","k":"h"},{"t":"(เนื้อหาส่วนนี้ปรากฏในสารบัญแต่ในไฟล์ที่ให้มาไม่มีรายละเอียดเนื้อหา)","k":"p"},{"t":"2.7.5 งานศึกษาด้านการพัฒนาสิ่งประดิษฐ์ทางสารสนเทศ","k":"h"},{"t":"Hevner และคณะ (2004) เสนอแนวคิด Design Science Research ซึ่งมุ่งสร้างและประเมินสิ่งประดิษฐ์ทางสารสนเทศเพื่อแก้ปัญหาที่มีความสำคัญต่อองค์การ","k":"p"},{"t":"Peffers และคณะ (2007) นำเสนอ Design Science Research Methodology ซึ่งประกอบด้วยการระบุปัญหา การกำหนดวัตถุประสงค์ การออกแบบและพัฒนา การสาธิต การประเมินผล และการสื่อสารผล","k":"p"},{"t":"แนวทางดังกล่าวสอดคล้องกับลักษณะของการวิจัยครั้งนี้ เนื่องจากมีการศึกษาปัญหา พัฒนาระบบต้นแบบ ทดลองใช้ และประเมินผลจากตัวชี้วัดที่กำหนด","k":"p"},{"t":"2.7.6 การสังเคราะห์งานวิจัยที่เกี่ยวข้อง","k":"h"},{"t":"กลุ่มแนวคิด/งานศึกษา ข้อค้นพบที่นำมาใช้ การประยุกต์ในการวิจัย","k":"p"},{"t":"ERP สนับสนุนการบูรณาการข้อมูลและกระบวนการ ใช้ ERP เป็นโครงสร้างพื้นฐานด้านข้อมูล","k":"p"},{"t":"AI/Agent สนับสนุนการรับข้อมูล การให้เหตุผลและการใช้เครื่องมือ ใช้ AI Agent เป็นขั้นประสานการทำงาน","k":"p"},{"t":"การจัดการความรู้ ความรู้ฝังลึกสามารถถ่ายทอดเป็นความรู้ชัดแจ้ง ใช้ SECI สนับสนุนการสร้างกฎ สูตร และเงื่อนไข","k":"p"},{"t":"AI Governance ระบบ AI ต้องมีการควบคุมและตรวจสอบ ใช้ Rule-based Logic, สิทธิ์การเข้าถึง และ Human-in-the-loop","k":"p"},{"t":"Design Science พัฒนาและประเมิน Artifact เพื่อแก้ปัญหาองค์การ ใช้ประกอบกระบวนการออกแบบ พัฒนา และประเมินระบบ","k":"p"},{"t":"2.7.7 ช่องว่างการวิจัย","k":"h"},{"t":"จากการสังเคราะห์เอกสารและงานวิจัยที่เกี่ยวข้อง การวิจัยครั้งนี้กำหนดประเด็นที่ต้องการศึกษาเพิ่มเติม 4 ด้าน ได้แก่","k":"p"},{"t":"1. ด้านการบูรณาการกระบวนการ การประยุกต์ AI Agent ร่วมกับ ERP เพื่อสนับสนุนกระบวนการต่อเนื่องตั้งแต่การรับงาน การเสนอราคา การตรวจสอบวัตถุดิบ จนถึงการวางแผนการผลิตในบริบทของโรงพิมพ์ยังมีการศึกษาในจำนวนจำกัด","k":"p"},{"t":"2. ด้านการจัดการความรู้ของผู้ปฏิบัติงาน การนำความรู้จากประสบการณ์ของบุคลากรมาจัดโครงสร้างเป็นกฎ สูตร และเงื่อนไขที่สามารถใช้ร่วมกับ AI Agent และ ERP เป็นประเด็นที่จำเป็นต้องศึกษาในบริบทการปฏิบัติงานจริง","k":"p"},{"t":"3. ด้านการควบคุมผลลัพธ์ของ AI Agent การนำ AI Agent มาใช้กับข้อมูลด้านต้นทุน ราคา และการผลิตจำเป็นต้องมีกลไกควบคุมและตรวจสอบที่สอดคล้องกับความเสี่ยงของกระบวนการ","k":"p"},{"t":"4. ด้านหลักฐานจากการใช้งานจริง จำเป็นต้องมีการประเมินระบบในบริบทของสถานประกอบการจริง โดยใช้ตัวชี้วัดที่สะท้อนผลการดำเนินงานของกระบวนการและความคิดเห็นของผู้ใช้งาน","k":"p"},{"t":"ช่องว่างดังกล่าวนำไปสู่การกำหนดวัตถุประสงค์การวิจัย 3 ข้อ ได้แก่ การศึกษาปัญหาและความต้องการ การออกแบบและพัฒนาระบบ และการประเมินผลระบบต้นแบบ","k":"p"}],"no":"2.7","pdf":26,"pdfEnd":28,"book":17,"bookEnd":19,"toc":18,"cites":[5,0,2,7,11,8,10,9,3,1,6],"q":"งานวิจัยที่เกี่ยวข้องถูกสังเคราะห์จนเห็นช่องว่างการวิจัยหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 18 แต่หัวข้อนี้เริ่มจริงที่หน้า 17"}]},{"id":"c2-8","title":"2.8 กรอบแนวคิดการวิจัย","group":"บทที่ 2 เอกสารและงานวิจัยที่เกี่ยวข้อง","ch":2,"paras":[{"t":"จากการทบทวนและสังเคราะห์แนวคิด ผู้วิจัยกำหนดกรอบแนวคิดการวิจัยดังนี้","k":"p"},{"t":"สภาพปัญหาและความต้องการของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"↓","k":"p"},{"t":"การวิเคราะห์กระบวนการ ข้อมูล และความรู้ของผู้ปฏิบัติงาน","k":"p"},{"t":"↓","k":"p"},{"t":"การออกแบบและพัฒนาระบบ AI Agent ERP","k":"p"},{"t":"↓","k":"p"},{"t":"ERP และฐานข้อมูล | AI Agent | กฎทางธุรกิจและสูตรคำนวณ | ความรู้ขององค์การ | Human-in-the-loop","k":"p"},{"t":"↓","k":"p"},{"t":"กระบวนการของระบบ","k":"p"},{"t":"Order Intake and Specification → Quotation Generator → Material Availability → Production Planning → Human-in-the-loop","k":"p"},{"t":"↓","k":"p"},{"t":"การทดลองใช้ในโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"↓","k":"p"},{"t":"การประเมินผล","k":"p"},{"t":"1. เวลาในการออกใบเสนอราคา","k":"p"},{"t":"2. ความถูกต้องของข้อมูลคำสั่งผลิต","k":"p"},{"t":"3. เวลาในการจัดทำแผนการผลิต","k":"p"},{"t":"4. ความเหมาะสมของระบบโดยผู้เชี่ยวชาญ","k":"p"},{"t":"5. ความพึงพอใจของผู้ใช้งาน","k":"p"},{"t":"↓","k":"p"},{"t":"ข้อมูลป้อนกลับสำหรับการปรับปรุงระบบและกระบวนการ","k":"p"},{"t":"กรอบแนวคิดดังกล่าวเชื่อมโยงกับวัตถุประสงค์การวิจัยทั้ง 3 ข้อโดยตรง กล่าวคือ วัตถุประสงค์ข้อที่ 1 เป็นการศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็น วัตถุประสงค์ข้อที่ 2 เป็นการนำผลการศึกษามาออกแบบและพัฒนาระบบต้นแบบ และวัตถุประสงค์ข้อที่ 3 เป็นการประเมินความเหมาะสมของระบบและผลจากการทดลองใช้ระบบ","k":"p"},{"t":"ในการวิจัยครั้งนี้ ERP, AI Agent และ SECI ทำหน้าที่เป็นพื้นฐานในการออกแบบและอธิบายระบบ ส่วน Design Science Research ใช้ประกอบกระบวนการพัฒนาสิ่งประดิษฐ์และจะอธิบายในรายละเอียดในบทที่ 3 โดยตัวแปรผลที่นำมาเปรียบเทียบเชิงสถิติตามสมมติฐานการวิจัยมี 3 ตัว ได้แก่ เวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต และเวลาในการจัดทำแผนการผลิต ส่วนความเหมาะสมของระบบและความพึงพอใจของผู้ใช้งานใช้การประเมินเชิงพรรณนาตามเกณฑ์ที่กำหนด","k":"p"},{"t":"สรุปบทที่ 2","k":"p"},{"t":"บทนี้นำเสนอแนวคิดและงานวิจัยที่เกี่ยวข้องกับการพัฒนาระบบ AI Agent ERP ประกอบด้วย การจัดการงานพิมพ์ ระบบ ERP ปัญญาประดิษฐ์แบบเอเจนต์ การจัดการความรู้ตามแบบจำลอง SECI แนวคิดองค์การในฐานะระบบเปิด การกำกับดูแลระบบ AI และแนวทางการพัฒนาสิ่งประดิษฐ์ทางสารสนเทศ","k":"p"},{"t":"การสังเคราะห์แนวคิดนำไปสู่การออกแบบระบบต้นแบบที่เชื่อมโยง ERP + AI Agent + Business Rules + Organizational Knowledge + Human-in-the-loop เพื่อสนับสนุนกระบวนการรับงาน การเสนอราคา การตรวจสอบวัตถุดิบ และการวางแผนการผลิต","k":"p"},{"t":"กรอบแนวคิดดังกล่าวเชื่อมโยงกับ 3 วัตถุประสงค์และ 3 สมมติฐานของบทที่ 1 โดยไม่เพิ่มตัวแปรหรือทฤษฎีที่ไม่ได้ถูกนำไปใช้ในการดำเนินการวิจัย และเป็นพื้นฐานสำหรับการกำหนดวิธีดำเนินการวิจัยในบทที่ 3 ต่อไป","k":"p"}],"no":"2.8","pdf":29,"pdfEnd":31,"book":20,"bookEnd":22,"toc":21,"cites":[],"q":"กรอบแนวคิดการวิจัยเชื่อมตัวแปรต้น ตัวแปรตาม และสมมติฐานครบถ้วนหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 21 แต่หัวข้อนี้เริ่มจริงที่หน้า 20"}]},{"id":"c3-0","title":"เกริ่นนำบทที่ 3","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"การวิจัยเรื่อง “การพัฒนาระบบเอไอเอเจนต์อีอาร์พีเพื่อเพิ่มประสิทธิภาพการเสนอราคาและการวางแผนผลิตในอุตสาหกรรมพิมพ์บรรจุภัณฑ์” เป็นการวิจัยและพัฒนา (Research and Development: R&D) โดยประยุกต์แนวคิดการวิจัยเชิงออกแบบ (Design Science Research: DSR) ในกระบวนการออกแบบ พัฒนา และประเมินระบบต้นแบบ และใช้ข้อมูลเชิงคุณภาพและเชิงปริมาณตามวัตถุประสงค์ของการวิจัย","k":"p"},{"t":"การดำเนินการวิจัยแบ่งออกเป็น 3 ระยะ ได้แก่ (1) การศึกษาสภาพปัญหาและความต้องการ (2) การออกแบบและพัฒนาระบบต้นแบบ และ (3) การทดลองใช้และประเมินผลระบบ โดยมีรายละเอียดดังต่อไปนี้","k":"p"}],"pdf":32,"pdfEnd":32,"book":23,"bookEnd":23,"toc":24,"cites":[],"q":"บทที่ 3 สรุปแนวทางการดำเนินการวิจัยไว้ชัดเจนหรือไม่","fd":[{"lv":"ตรวจ","t":"บทนี้เริ่มต่อท้ายหน้าเดิม ไม่ขึ้นหน้าใหม่ ควรตรวจกับรูปแบบเล่มของบัณฑิตวิทยาลัย"},{"lv":"แก้","t":"สารบัญระบุหน้า 24 แต่หัวข้อนี้เริ่มจริงที่หน้า 23"}]},{"id":"c3-1","title":"3.1 รูปแบบการวิจัย","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"การวิจัยครั้งนี้เป็นการวิจัยและพัฒนา โดยมุ่งสร้างระบบต้นแบบเพื่อแก้ไขปัญหาที่เกิดขึ้นในกระบวนการปฏิบัติงานจริงของโรงพิมพ์กรณีศึกษา และประเมินผลของระบบภายหลังการพัฒนา","k":"p"},{"t":"ผู้วิจัยประยุกต์แนวคิด Design Science Research ของ Hevner และคณะ (2004) และกระบวนการ Design Science Research Methodology ของ Peffers และคณะ (2007) ในส่วนของการระบุปัญหา การกำหนดวัตถุประสงค์ของระบบ การออกแบบและพัฒนา การนำระบบไปทดลองใช้ และการประเมินผล","k":"p"},{"t":"การดำเนินงานแบ่งเป็น 3 ระยะ ดังนี้","k":"p"},{"t":"ระยะที่ 1 การศึกษาสภาพปัญหาและความต้องการ (Diagnosis and Requirements Analysis)","k":"p"},{"t":"ศึกษากระบวนการทำงานเดิม ปัญหา ความต้องการ และความรู้ที่เกี่ยวข้องกับกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต โดยใช้การสัมภาษณ์ การสังเกตกระบวนการทำงาน และการศึกษาเอกสารหรือข้อมูลจากการปฏิบัติงาน","k":"p"},{"t":"ผลจากระยะนี้นำไปใช้กำหนดความต้องการของระบบ (System Requirements) และองค์ประกอบที่จำเป็นสำหรับการพัฒนาระบบต้นแบบ","k":"p"},{"t":"ระยะที่ 2 การออกแบบและพัฒนาระบบ (Design and Development)","k":"p"},{"t":"นำผลจากระยะที่ 1 มาออกแบบสถาปัตยกรรมและกระบวนการทำงานของระบบ AI Agent ERP ประกอบด้วยการกำหนดโมดูล การเชื่อมโยงข้อมูล ERP กฎทางธุรกิจ สูตรคำนวณ เงื่อนไขการตรวจสอบ และกลไก Human-in-the-loop จากนั้นจึงพัฒนาและทดสอบระบบต้นแบบ รวมทั้งประเมินความเหมาะสมของระบบโดยผู้เชี่ยวชาญ","k":"p"},{"t":"ระยะที่ 3 การทดลองใช้และประเมินผล (Implementation and Evaluation)","k":"p"},{"t":"นำระบบต้นแบบไปทดลองใช้ในกระบวนการปฏิบัติงานของโรงพิมพ์กรณีศึกษาเป็นระยะเวลา 4 สัปดาห์ เก็บข้อมูลผลการดำเนินงานก่อนและหลังการใช้ระบบ และประเมินความพึงพอใจของผู้ใช้งาน","k":"p"},{"t":"ตัวชี้วัดผลการดำเนินงานประกอบด้วย","k":"p"},{"t":"เวลาในการออกใบเสนอราคา","k":"li"},{"t":"ความถูกต้องของข้อมูลคำสั่งผลิต","k":"li"},{"t":"เวลาในการจัดทำแผนการผลิต","k":"li"},{"t":"ส่วนผลการประเมินด้านบุคคลประกอบด้วยความเหมาะสมของระบบโดยผู้เชี่ยวชาญและความพึงพอใจของผู้ใช้งาน","k":"p"}],"no":"3.1","pdf":32,"pdfEnd":33,"book":23,"bookEnd":24,"toc":24,"cites":[1,6],"q":"รูปแบบการวิจัยเหมาะกับวัตถุประสงค์ และแบ่งระยะการดำเนินงานชัดเจนหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 24 แต่หัวข้อนี้เริ่มจริงที่หน้า 23"}]},{"id":"c3-2","title":"3.2 ประชากร กลุ่มผู้ให้ข้อมูล และหน่วยวิเคราะห์","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"3.2.1 ประชากร","k":"h"},{"t":"ประชากรด้านบุคลากรในการวิจัย ได้แก่ ผู้บริหาร หัวหน้างาน และบุคลากรของโรงพิมพ์กรณีศึกษาที่เกี่ยวข้องกับกระบวนการรับงาน การเสนอราคา การจัดซื้อและตรวจสอบวัตถุดิบ การวางแผน และการผลิต","k":"p"},{"t":"ประชากรที่เกี่ยวข้องกับกระบวนการดังกล่าวมีประมาณ 45 คน","k":"p"},{"t":"3.2.2 กลุ่มผู้ให้ข้อมูลและผู้ประเมิน","k":"h"},{"t":"การวิจัยใช้การคัดเลือกแบบเจาะจง (Purposive Sampling) ตามบทบาท ความรู้ ประสบการณ์ และความเกี่ยวข้องกับกระบวนการที่ศึกษา โดยแบ่งเป็น 2 กลุ่ม ได้แก่","k":"p"},{"t":"กลุ่มที่ 1 ผู้เชี่ยวชาญ จำนวน 10 คน ใช้สำหรับให้ข้อมูลเกี่ยวกับสภาพปัญหา ความต้องการ และองค์ประกอบของระบบ รวมทั้งประเมินความเหมาะสมของระบบต้นแบบ","k":"p"},{"t":"กลุ่มที่ 2 ผู้ใช้งานระบบ จำนวน 20 คน เป็นบุคลากรที่เกี่ยวข้องกับกระบวนการที่ศึกษาและเข้าร่วมทดลองใช้ระบบต้นแบบ ใช้สำหรับประเมินความพึงพอใจภายหลังการใช้งาน ซึ่งสอดคล้องกับตารางรหัสผู้ใช้ U01–U20 ที่นำเสนอในบทที่ 4","k":"p"},{"t":"ดังนั้น จำนวนบุคลากรที่เข้าร่วมในส่วนต่าง ๆ ของการวิจัยรวม 30 คน แต่การวิเคราะห์ข้อมูลมิได้นำผู้เชี่ยวชาญ 10 คนและผู้ใช้งาน 20 คนมารวมกันเป็นกลุ่มตัวอย่างเดียวสำหรับการทดสอบผลก่อนและหลังการใช้ระบบ","k":"p"},{"t":"3.2.3 หน่วยวิเคราะห์","k":"h"},{"t":"การวิจัยกำหนดหน่วยวิเคราะห์เป็น 2 ระดับ ได้แก่","k":"p"},{"t":"1. ระดับบุคคล (Person-level) ใช้สำหรับข้อมูลจากการสัมภาษณ์ การประเมินความเหมาะสมของระบบโดยผู้เชี่ยวชาญ และการประเมินความพึงพอใจของผู้ใช้งาน","k":"p"},{"t":"2. ระดับงาน (Job-level) ใช้สำหรับการเปรียบเทียบผลการดำเนินงานก่อนและหลังการใช้ระบบ ได้แก่ เวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต และเวลาในการจัดทำแผนการผลิต","k":"p"},{"t":"การแยกหน่วยวิเคราะห์ดังกล่าวทำให้การประเมินผลด้านกระบวนการไม่ถูกนำไปรวมกับจำนวนผู้ประเมินระบบหรือจำนวนผู้ตอบแบบสอบถามความพึงพอใจ","k":"p"}],"no":"3.2","pdf":34,"pdfEnd":34,"book":25,"bookEnd":25,"toc":26,"cites":[],"q":"ประชากร กลุ่มผู้ให้ข้อมูล และหน่วยวิเคราะห์ กำหนดอย่างมีเหตุผลหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 26 แต่หัวข้อนี้เริ่มจริงที่หน้า 25"}]},{"id ance)","k":"li"},{"t":"ใช้มาตรประมาณค่า 5 ระดับ","k":"p"},{"t":"3.3.4 แบบสอบถามความพึงพอใจของผู้ใช้งาน","k":"h"},{"t":"แบบสอบถามความพึงพอใจประกอบด้วยข้อคำถามจำนวน 15 ข้อ ครอบคลุม 5 ด้าน ได้แก่","k":"p"},{"t":"1. ความรวดเร็ว","k":"p"},{"t":"2. ความถูกต้อง","k":"p"},{"t":"3. ความง่ายในการใช้งาน","k":"p"},{"t":"4. ประโยชน์ที่ได้รับ","k":"p"},{"t":"5. ความพึงพอใจโดยรวม","k":"p"},{"t":"ใช้มาตรประมาณค่า 5 ระดับ","k":"p"},{"t":"เกณฑ์การแปลผลค่าเฉลี่ยกำหนดดังนี้","k":"p"},{"t":"ค่าเฉลี่ย ระดับความคิดเห็น","k":"p"},{"t":"4.51-5.00 มากที่สุด","k":"p"},{"t":"3.51-4.50 มาก","k":"p"},{"t":"2.51-3.50 ปานกลาง","k":"p"},{"t":"1.51-2.50 น้อย","k":"p"},{"t":"1.00-1.50 น้อยที่สุด","k":"p"},{"t":"3.3.5 แบบบันทึกผลก่อนและหลังการใช้ระบบ","k":"h"},{"t":"แบบบันทึกใช้เก็บข้อมูลระดับงาน ประกอบด้วยข้อมูลพื้นฐานของงานและตัวชี้วัดก่อนและหลังการใช้ระบบ ได้แก่","k":"p"},{"t":"1. เวลาในการออกใบเสนอราคา มีหน่วยเป็นนาทีต่อรายการ","k":"p"},{"t":"2. ความถูกต้องของข้อมูลคำสั่งผลิต มีหน่วยเป็นร้อยละ","k":"p"},{"t":"3. เวลาในการจัดทำแผนการผลิต มีหน่วยเป็นนาทีต่อรายการ","k":"p"},{"t":"4. จำนวนครั้งที่มีการแก้ไขหรือข้อผิดพลาดที่เกี่ยวข้อง","k":"p"},{"t":"การประเมินความถูกต้องของข้อมูลคำสั่งผลิตให้หน่วยวิเคราะห์ระดับใบสั่งผลิต โดยผู้ตรวจสอบอิสระตรวจทุกรายการในใบสั่งผลิตเทียบกับสเปกต้นทางจาก ERP บิลที่ข้อมูลถูกต้องครบถ้วนทุกรายการถือว่าผ่าน บิลที่มีข้อผิดพลาดอย่างน้อย 1 จุดถือว่าไม่ผ่าน จากนั้นคำนวณเป็นร้อยละของบิลที่ผ่าน เพื่อให้สอดคล้องกับวิธีวัดในหัวข้อ 4.3.3 และตารางที่ 4.2ก ของบทที่ 4","k":"p"}],"no":"3.3","pdf":35,"pdfEnd":36,"book":26,"bookEnd":27,"toc":27,"cites":[],"q":"เครื่องมือวิจัยแต่ละชนิดวัดสิ่งที่ต้องการวัดตรงตามวัตถุประสงค์หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 27 แต่หัวข้อนี้เริ่มจริงที่หน้า 26"}]},{"id":"c3-4","title":"3.4 การตรวจสอบคุณภาพเครื่องมือ","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"ผู้วิจัยดำเนินการตรวจสอบคุณภาพเครื่องมือก่อนนำไปใช้เก็บรวบรวมข้อมูลจริง โดยพิจารณาความตรงเชิงเนื้อหาและความเชื่อมั่นตามลักษณะของเครื่องมือ","k":"p"},{"t":"3.4.1 ความตรงเชิงเนื้อหา","k":"h"},{"t":"แบบสัมภาษณ์ แบบประเมินความเหมาะสม และแบบสอบถามความพึงพอใจได้รับการตรวจสอบความสอดคล้องระหว่างข้อคำถามกับวัตถุประสงค์หรือประเด็นที่ต้องการวัด โดยใช้ดัชนีความสอดคล้อง (Index of Item-Objective Congruence: IOC)","k":"p"},{"t":"เกณฑ์การพิจารณากำหนดให้ข้อคำถามที่มีค่า IOC ตั้งแต่ 0.50 ขึ้นไปสามารถนำไปใช้ได้ ผลการตรวจสอบเครื่องมือในการวิจัยครั้งนี้พบว่าค่า IOC อยู่ระหว่าง 0.60–1.00","k":"p"},{"t":"3.4.2 ความเชื่อมั่นของแบบประเมิน","k":"h"},{"t":"แบบประเมินความเหมาะสมของระบบและแบบสอบถามความพึงพอใจได้รับการตรวจสอบความเชื่อมั่นด้วยค่าสัมประสิทธิ์แอลฟาของครอนบาค (Cronbach’s Alpha)","k":"p"},{"t":"ผลการตรวจสอบพบว่า","k":"p"},{"t":"1. แบบประเมินความเหมาะสมของระบบ มีค่าความเชื่อมั่น 0.89","k":"p"},{"t":"2. แบบสอบถามความพึงพอใจของผู้ใช้งาน มีค่าความเชื่อมั่น 0.91","k":"p"},{"t":"ค่าดังกล่าวอยู่ในระดับที่สามารถนำเครื่องมือไปใช้ในการเก็บรวบรวมข้อมูลได้","k":"p"},{"t":"สำหรับแบบสัมภาษณ์กึ่งโครงสร้าง ใช้การตรวจสอบความตรงเชิงเนื้อหาและความเหมาะสมของประเด็นคำถาม ไม่ใช้ Cronbach’s Alpha เนื่องจากมิใช่แบบวัดหลายข้อที่มุ่งวัดโครงสร้างเดียวกันในลักษณะมาตรประมาณค่า","k":"p"}],"no":"3.4","pdf":37,"pdfEnd":37,"book":28,"bookEnd":28,"toc":30,"cites":[],"q":"การตรวจสอบคุณภาพเครื่องมือใช้เกณฑ์และค่าสถิติที่ยอมรับได้หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 30 แต่หัวข้อนี้เริ่มจริงที่หน้า 28"}]},{"id":"c3-5","title":"3.5 การพัฒนาระบบต้นแบบ","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"การพัฒนาระบบดำเนินการตามลำดับจากผลการวิเคราะห์ความต้องการในระยะที่ 1 ไปสู่การออกแบบ พัฒนา ทดสอบ และปรับปรุงระบบ","k":"p"},{"t":"3.5.1 การวิเคราะห์กระบวนการเดิม","k":"h"},{"t":"ผู้วิจัยศึกษากระบวนการทำงานเดิม (As-Is Process) ตั้งแต่การรับข้อกำหนดของลูกค้า การรวบรวมข้อมูล การคำนวณต้นทุน การจัดทำใบเสนอราคา การตรวจสอบวัตถุดิบ และการวางแผนการผลิต","k":"p"},{"t":"ผลการวิเคราะห์ใช้สำหรับระบุจุดที่เกิดความล่าช้า ความคลาดเคลื่อนของข้อมูล การทำงานซ้ำ และขั้นตอนที่พึ่งพาความรู้ของบุคลากร","k":"p"},{"t":"3.5.2 การกำหนดความต้องการของระบบ","k":"h"},{"t":"ผลจากการสัมภาษณ์ การสังเกต และการวิเคราะห์กระบวนการถูกนำมาจัดทำความต้องการของระบบ โดยครอบคลุมความต้องการด้านหน้าที่การทำงาน ข้อมูล การเชื่อมโยงระบบ การใช้งาน และการควบคุมผลลัพธ์","k":"p"},{"t":"3.5.3 การจัดการความรู้สำหรับระบบ","k":"h"},{"t":"ความรู้จากผู้ปฏิบัติงานเกี่ยวกับการคำนวณต้นทุน วัสดุ เงื่อนไขของงาน และการวางแผนการผลิตถูกนำมาจัดโครงสร้างให้อยู่ในรูปของกฎ สูตร และเงื่อนไขที่ระบบสามารถใช้ได้","k":"p"},{"t":"กระบวนการดังกล่าวประยุกต์แนวคิด SECI โดยเฉพาะการถ่ายทอดความรู้ฝังลึกออกมาเป็นความรู้ชัดแจ้ง และการเชื่อมโยงความรู้ดังกล่าวกับข้อมูลที่มีอยู่ในระบบ","k":"p"},{"t":"3.5.4 การออกแบบระบบ","k":"h"},{"t":"ระบบต้นแบบได้รับการออกแบบให้ AI Agent ทำหน้าที่ประสานการทำงานระหว่างผู้ใช้งาน กฎทางธุรกิจ เครื่องมือคำนวณ และข้อมูลจาก ERP","k":"p"},{"t":"กระบวนการโดยสรุป ได้แก่","k":"p"},{"t":"ผู้ใช้งาน → AI Agent → ตรวจสอบข้อมูล → เรียกใช้ ERP/เครื่องมือ → ประมวลผลตามกฎ → สร้างผลลัพธ์เบื้องต้น → Human-in-the-loop → ยืนยันผลลัพธ์","k":"p"},{"t":"3.5.5 การพัฒนาและทดสอบระบบ","k":"h"},{"t":"ระบบต้นแบบได้รับการพัฒนาโดยเชื่อมโยง AI Agent กับ ERP ผ่านกลไกการแลกเปลี่ยนข้อมูลที่กำหนด และใช้กฎทางธุรกิจสำหรับการคำนวณหรือการตรวจสอบที่ต้องการความแน่นอน","k":"p"},{"t":"หลังการพัฒนา ผู้วิจัยทดสอบการทำงานของแต่ละโมดูล ตรวจสอบการเชื่อมโยงระหว่างโมดูล และทดสอบกระบวนการทำงานโดยรวม ก่อนนำระบบไปประเมินโดยผู้เชี่ยวชาญและทดลองใช้กับผู้ใช้งาน","k":"p"}],"no":"3.5","pdf":38,"pdfEnd":38,"book":29,"bookEnd":29,"toc":31,"cites":[],"q":"ขั้นตอนการพัฒนาระบบต้นแบบเป็นระบบ ทำซ้ำได้ และมีการทดสอบหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 31 แต่หัวข้อนี้เริ่มจริงที่หน้า 29"}]},{"id":"c3-6","title":"3.6 การเก็บรวบรวมข้อมูล","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"การเก็บรวบรวมข้อมูลดำเนินการตาม 3 ระยะของการวิจัย","k":"p"},{"t":"ระยะที่ 1 ศึกษาสภาพปัญหาและความต้องการ","k":"p"},{"t":"ผู้วิจัยสัมภาษณ์ผู้ให้ข้อมูล ศึกษากระบวนการทำงาน สังเกตการปฏิบัติงาน และศึกษาข้อมูลหรือเอกสารที่เกี่ยวข้องกับกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต","k":"p"},{"t":"ข้อมูลเชิงคุณภาพถูกนำมาวิเคราะห์เพื่อระบุปัญหา ความต้องการ และองค์ประกอบของระบบ","k":"p"},{"t":"ระยะที่ 2 ออกแบบและพัฒนาระบบ","k":"p"},{"t":"นำผลจากระยะที่ 1 มาออกแบบและพัฒนาระบบต้นแบบ จากนั้นทดสอบระบบและให้ผู้เชี่ยวชาญประเมินความเหมาะสม นำผลการประเมินและข้อเสนอแนะมาปรับปรุงระบบก่อนการทดลองใช้","k":"p"},{"t":"ระยะที่ 3 ทดลองใช้และประเมินผล","k":"p"},{"t":"นำระบบต้นแบบที่ผ่านการปรับปรุงไปทดลองใช้เป็นระยะเวลา 4 สัปดาห์ โดยเก็บข้อมูลผลการดำเนินงานตามตัวชี้วัดก่อนและหลังการใช้ระบบในระดับงาน จากบิลงานพิมพ์จริงจำนวน 30 คู่ (before-after) ย้อนหลัง 3 เดือน ของโรงพิมพ์กรณีศึกษา บนบิลชุดเดียวกันทั้งก่อนและหลังใช้ระบบ การวัดเวลาในการออกใบเสนอราคาใช้การจับเวลาจริงตั้งแต่รับสเปกงานจนได้ใบเสนอราคาฉบับแรก มีหน่วยเป็นนาทีต่อรายการ โดยมีผู้ปฏิบัติงานจับเวลาและบันทึกผล (ไม่ระบุจำนวนคนตีราคา) และมีผู้ตรวจสอบอิสระจำนวน 1 คน ซึ่งไม่ใช่ผู้จัดทำ ทำหน้าที่ตรวจความถูกต้องของข้อมูลคำสั่งผลิต ภายหลังการทดลองใช้ ผู้ใช้งานจำนวน 20 คนตอบแบบสอบถามความพึงพอใจต่อระบบ","k":"p"}],"no":"3.6","pdf":39,"pdfEnd":39,"book":30,"bookEnd":30,"toc":32,"cites":[],"q":"การเก็บรวบรวมข้อมูลแต่ละระยะระบุแหล่ง วิธี และช่วงเวลาชัดเจนหรือไม่","fd":[{"lv":"ตรวจ","t":"ช่วงหลังใช้ระบบวัดจากการประมวลผลซ้ำบิลย้อนหลัง 3 เดือน แต่หลายหัวข้อระบุการทดลองใช้ 4 สัปดาห์ ควรเขียนให้ชัดว่าค่า \"หลังใช้ระบบ\" ได้จากการใช้งานจริงหรือการประมวลผลซ้ำบิลเดิม"},{"lv":"แก้","t":"สารบัญระบุหน้า 32 แต่หัวข้อนี้เริ่มจริงที่หน้า 30"}]},{"id":"c3-7","title":"3.7 การวิเคราะห์ข้อมูล","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"3.7.1 ข้อมูลเชิงคุณภาพ","k":"h"},{"t":"ข้อมูลจากการสัมภาษณ์ การสังเกต และข้อมูลประกอบจากกระบวนการทำงานใช้การวิเคราะห์เนื้อหา (Content Analysis) โดยจัดหมวดหมู่ประเด็นเกี่ยวกับ","k":"p"},{"t":"1. ปัญหาของกระบวนการเดิม","k":"p"},{"t":"2. ความต้องการของผู้ใช้งาน","k":"p"},{"t":"3. ข้อมูลที่จำเป็นต่อระบบ","k":"p"},{"t":"4. ความรู้และกฎทางธุรกิจ","k":"p"},{"t":"5. องค์ประกอบและหน้าที่ของระบบ","k":"p"},{"t":"ผลการวิเคราะห์ใช้ตอบวัตถุประสงค์การวิจัยข้อที่ 1 และเป็นข้อมูลสำหรับการออกแบบระบบตามวัตถุประสงค์ข้อที่ 2","k":"p"},{"t":"3.7.2 การประเมินความเหมาะสมและความพึงพอใจ","k":"h"},{"t":"ข้อมูลจากแบบประเมินความเหมาะสมของระบบและแบบสอบถามความพึงพอใจวิเคราะห์ด้วย","k":"p"},{"t":"1. ค่าเฉลี่ย (Mean)","k":"p"},{"t":"2. ส่วนเบี่ยงเบนมาตรฐาน (Standard Deviation)","k":"p"},{"t":"และแปลผลตามเกณฑ์ระดับความคิดเห็น 5 ระดับที่กำหนดไว้","k":"p"},{"t":"3.7.3 การเปรียบเทียบผลก่อนและหลังการใช้ระบบ","k":"h"},{"t":"ตัวชี้วัดที่ใช้เปรียบเทียบประกอบด้วย","k":"p"},{"t":"1. เวลาในการออกใบเสนอราคา","k":"p"},{"t":"2. ความถูกต้องของข้อมูลคำสั่งผลิต","k":"p"},{"t":"3. เวลาในการจัดทำแผนการผลิต","k":"p"},{"t":"เนื่องจากเป็นการเปรียบเทียบข้อมูลก่อนและหลังจากหน่วยงานที่จับคู่กัน จึงพิจารณาการแจกแจงของค่าความแตกต่างระหว่างข้อมูลก่อนและหลัง สำหรับแต่ละตัวชี้วัด","k":"p"},{"t":"ใช้ Shapiro-Wilk Test ตรวจสอบการแจกแจงของค่าความแตกต่าง หากไม่พบหลักฐานว่าค่าความแตกต่างเบี่ยงเบนจากการแจกแจงปกติ ใช้ Paired Samples t-test สำหรับการเปรียบเทียบค่าเฉลี่ยก่อนและหลัง","k":"p"},{"t":"หากข้อมูลไม่เป็นไปตามข้อสมมติที่เหมาะสมสำหรับ Paired Samples t-test ใช้ Wilcoxon Signed-Rank Test เป็นวิธีทางเลือก","k":"p"},{"t":"กำหนดระดับนัยสำคัญทางสถิติที่ .05","k":"p"},{"t":"นอกจากการทดสอบนัยสำคัญทางสถิติแล้ว รายงานขนาดของความแตกต่าง (Effect Size) เพื่อประกอบการตีความผล โดยเลือกวิธีคำนวณให้สอดคล้องกับสถิติที่ใช้","k":"p"}],"no":"3.7","pdf":40,"pdfEnd":41,"book":31,"bookEnd":32,"toc":33,"cites":[],"q":"สถิติที่ใช้วิเคราะห์เหมาะกับลักษณะข้อมูลและสมมติฐานหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 33 แต่หัวข้อนี้เริ่มจริงที่หน้า 31"}]},{"id":"c3-8","title":"3.8 ตัวแปรและตัวชี้วัดในการวิจัย","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"ตารางที่ 3.1 ตัวแปรและตัวชี้วัด","k":"cap"},{"t":"ตัวชี้วัด นิยามเชิงปฏิบัติการ หน่วย/วิธีวัด","k":"row"},{"t":"เวลาในการออกใบเสนอราคา ระยะเวลาตั้งแต่รับสเปกงานจนได้ใบเสนอราคาฉบับแรก (จับเวลาจริง) นาที/รายการ","k":"p"},{"t":"ความถูกต้องของข้อมูลคำสั่งผลิต ร้อยละของบิลใบสั่งผลิตที่ผ่าน โดยตรวจทุกรายการเทียบสเปกต้นทางจาก ERP (ถูกหมด = ผ่าน มีผิดอย่างน้อย 1 จุด = ไม่ผ่าน) ร้อยละ","k":"p"},{"t":"เวลาในการจัดทำแผนการผลิต ระยะเวลาตั้งแต่เริ่มจัดทำแผนจนได้แผ
