ับการควบคุม ผู้วิจัยกำหนดแนวทางดังนี้","k":"p"},{"t":"ความเสี่ยง แนวทางจัดการ","k":"p"},{"t":"AI ให้ผลลัพธ์คลาดเคลื่อน ใช้กฎทางธุรกิจสำหรับการคำนวณสำคัญและ Human-in-the-loop","k":"p"},{"t":"ข้อมูลจาก ERP ไม่ครบถ้วนหรือคลาดเคลื่อน ตรวจสอบและทำความสะอาดข้อมูลก่อนนำมาใช้","k":"p"},{"t":"ผู้ใช้งานไม่คุ้นเคยกับระบบ ชี้แจงและสาธิตวิธีใช้งานก่อนการทดลอง","k":"p"},{"t":"ข้อจำกัดด้านระยะเวลา จำกัดขอบเขตการพัฒนาเฉพาะกระบวนการที่กำหนด","k":"p"},{"t":"การเข้าถึงข้อมูลโดยไม่ได้รับอนุญาต กำหนดสิทธิ์การเข้าถึงและควบคุมการใช้งานข้อมูล","k":"p"},{"t":"ผลลัพธ์ของระบบถูกนำไปใช้โดยไม่ตรวจสอบ กำหนดขั้นตอนยืนยันโดยผู้ใช้งานก่อนนำผลลัพธ์สำคัญไปใช้","k":"p"}],"no":"3.10","pdf":43,"pdfEnd":43,"book":34,"bookEnd":34,"toc":36,"cites":[],"q":"ความเสี่ยงในการวิจัยถูกระบุพร้อมแนวทางจัดการครบหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 36 แต่หัวข้อนี้เริ่มจริงที่หน้า 34"}]},{"id":"c3-11","title":"3.11 การคุ้มครองข้อมูลและจริยธรรมในการวิจัย","group":"บทที่ 3 วิธีการดำเนินการวิจัย","ch":3,"paras":[{"t":"การดำเนินการวิจัยคำนึงถึงการรักษาความลับของข้อมูลของโรงพิมพ์กรณีศึกษาและข้อมูลของผู้เข้าร่วมการวิจัย โดยไม่เปิดเผยชื่อองค์การในรายงานวิจัย และนำเสนอข้อมูลในลักษณะที่ไม่ระบุตัวบุคคล","k":"p"},{"t":"ข้อมูลที่เกี่ยวข้องกับต้นทุน ราคา ลูกค้า และกระบวนการดำเนินงานใช้เพื่อวัตถุประสงค์ของการวิจัยตามขอบเขตที่กำหนด มีการควบคุมสิทธิ์ในการเข้าถึงข้อมูลและจำกัดการใช้งานตามความจำเป็น","k":"p"},{"t":"ผู้เข้าร่วมได้รับข้อมูลเกี่ยวกับวัตถุประสงค์และกระบวนการของการศึกษา รวมถึงการนำข้อมูลไปใช้ประกอบการวิจัย และดำเนินการเก็บข้อมูลโดยคำนึงถึงความสมัครใจและการรักษาความลับของผู้เข้าร่วม","k":"p"},{"t":"สรุปบทที่ 3","k":"p"},{"t":"การวิจัยครั้งนี้เป็นการวิจัยและพัฒนา โดยประยุกต์ Design Science Research ในกระบวนการออกแบบ พัฒนา และประเมินระบบต้นแบบ AI Agent ERP แบ่งการดำเนินงานเป็น 3 ระยะ ได้แก่ การศึกษาสภาพปัญหาและความต้องการ การออกแบบและพัฒนาระบบ และการทดลองใช้และประเมินผล","k":"p"},{"t":"การประเมินแยกข้อมูลออกเป็น ระดับบุคคลและระดับงาน โดยผู้เชี่ยวชาญ 10 คนใช้สำหรับให้ข้อมูลและประเมินความเหมาะสมของระบบ ผู้ใช้งาน 20 คนใช้สำหรับทดลองใช้และประเมินความพึงพอใจ ส่วนการเปรียบเทียบเวลาในการออกใบเสนอราคา ความถูกต้องของข้อมูลคำสั่งผลิต และเวลาในการจัดทำแผนการผลิตให้ข้อมูลระดับงานแบบก่อนและหลัง","k":"p"},{"t":"ข้อมูลเชิงคุณภาพวิเคราะห์ด้วยการวิเคราะห์เนื้อหา ข้อมูลความเหมาะสมและความพึงพอใจวิเคราะห์ด้วยค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐาน ส่วนข้อมูลก่อนและหลังตรวจสอบการแจกแจงของค่าความแตกต่างและใช้ Paired Samples t-test หรือ Wilcoxon Signed-Rank Test ตามความเหมาะสม โดยกำหนดระดับนัยสำคัญทางสถิติที่ .05","k":"p"},{"t":"ผลจากวิธีดำเนินการดังกล่าวนำไปสู่การนำเสนอผลการวิเคราะห์สภาพปัญหา ผลการพัฒนาระบบ ผลการประเมินความเหมาะสม และผลการทดลองใช้ระบบใน บทที่ 4 ผลการวิจัย ต่อไป","k":"p"}],"no":"3.11","pdf":44,"pdfEnd":44,"book":35,"bookEnd":35,"toc":36,"cites":[],"q":"การคุ้มครองข้อมูลและจริยธรรมการวิจัยในมนุษย์ครบตามเกณฑ์หรือไม่","fd":[{"lv":"แก้","t":"ไม่พบเลขที่หรือหนังสือรับรองจากคณะกรรมการจริยธรรมการวิจัยในมนุษย์ พบเพียงคำชี้แจงและการขอความยินยอมในแบบสอบถาม"},{"lv":"ตรวจ","t":"หลังหัวข้อ 3.11 มีหน้าว่าง (เลขหน้า 36) ก่อนเริ่มบทที่ 4"},{"lv":"แก้","t":"สารบัญระบุหน้า 36 แต่หัวข้อนี้เริ่มจริงที่หน้า 35"}]},{"id":"c4-0","title":"เกริ่นนำบทที่ 4","group":"บทที่ 4 ผลการวิจัย","ch":4,"paras":[{"t":"การวิจัยเรื่อง “การพัฒนาระบบเอไอเอเจนต์อีอาร์พีเพื่อเพิ่มประสิทธิภาพการเสนอราคาและการวางแผนผลิตในอุตสาหกรรมพิมพ์บรรจุภัณฑ์” มีวัตถุประสงค์ 3 ประการ ได้แก่ (1) เพื่อศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ AI Agent ERP สำหรับสนับสนุนกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต (2) เพื่อออกแบบและพัฒนาระบบต้นแบบ AI Agent ERP และ (3) เพื่อประเมินความเหมาะสมของระบบ เปรียบเทียบผลการดำเนินงานก่อนและหลังการใช้ระบบ และประเมินความพึงพอใจของผู้ใช้งาน","k":"p"},{"t":"ผู้วิจัยนำเสนอผลการวิจัยตามลำดับวัตถุประสงค์ ดังนี้","k":"p"}],"pdf":46,"pdfEnd":46,"book":37,"bookEnd":37,"toc":38,"cites":[],"q":"บทที่ 4 นำเสนอผลเรียงตามวัตถุประสงค์หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 38 แต่หัวข้อนี้เริ่มจริงที่หน้า 37"}]},{"id":"c4-1","title":"4.1 สัญลักษณ์ที่ใช้ในการวิเคราะห์ข้อมูล","group":"บทที่ 4 ผลการวิจัย","ch":4,"paras":[{"t":"เพื่อให้การนำเสนอผลการวิเคราะห์ข้อมูลมีความชัดเจน ผู้วิจัยกำหนดสัญลักษณ์ที่ใช้ในการนำเสนอผล ดังนี้","k":"p"},{"t":"n หมายถึง จำนวนหน่วยข้อมูลที่ใช้ในการวิเคราะห์","k":"li"},{"t":"x̅ หมายถึง ค่าเฉลี่ย","k":"li"},{"t":"SD หมายถึง ส่วนเบี่ยงเบนมาตรฐาน","k":"li"}],"no":"4.1","pdf":46,"pdfEnd":46,"book":37,"bookEnd":37,"toc":38,"cites":[],"q":"สัญลักษณ์ทางสถิติที่ใช้ครบและนิยามถูกต้องหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 38 แต่หัวข้อนี้เริ่มจริงที่หน้า 37"}]},{"id":"c4-2","title":"4.2 ผลการศึกษาสภาพปัญหา ความต้องการ และองค์ประกอบที่จำเป็นของระบบ","group":"บทที่ 4 ผลการวิจัย","ch":4,"paras":[{"t":"ผลการศึกษาสภาพการดำเนินงานจากผู้ให้ข้อมูลจำนวน 10 คน ประกอบกับการศึกษากระบวนการทำงานและข้อมูลที่เกี่ยวข้อง พบประเด็นปัญหาสำคัญในกระบวนการรับงาน การเสนอราคา และการวางแผนการผลิต ดังตารางที่ 4.1","k":"p"},{"t":"ตารางที่ 4.1 สภาพปัญหาที่พบจากการศึกษา","k":"cap"},{"t":"สภาพปัญหา | จำนวนผู้ให้ข้อมูลที่กล่าวถึง (คน)","k":"row"},{"t":"การจัดทำใบเสนอราคาใช้เวลานาน | 10","k":"row"},{"t":"ข้อมูลคำสั่งผลิตมีความคลาดเคลื่อน | 9","k":"row"},{"t":"การวางแผนการผลิตยังไม่มีประสิทธิภาพเพียงพอ | 8","k":"row"},{"t":"ความรู้สำคัญผูกติดกับบุคลากร | 10","k":"row"},{"t":"ไม่สามารถเรียกใช้ข้อมูลต้นทุนได้ทันทีในบางขั้นตอน | 7","k":"row"},{"t":"การเรียกใช้ข้อมูลจาก ERP ยังมีข้อจำกัดในบางกระบวนการ | 6","k":"row"},{"t":"จากตารางที่ 4.1 พบว่า ประเด็นที่ผู้ให้ข้อมูลกล่าวถึงมากที่สุด ได้แก่ การจัดทำใบเสนอราคาใช้เวลานานและความรู้สำคัญผูกติดกับบุคลากร รองลงมาคือความคลาดเคลื่อนของข้อมูลคำสั่งผลิต และข้อจำกัดด้านการวางแผนการผลิต ผลการวิเคราะห์กระบวนการทำงานยังพบว่า การจัดทำใบเสนอราคาต้องใช้ข้อมูลจากหลายแหล่งและอาศัยการตรวจสอบโดยผู้ปฏิบัติงาน ขณะที่ข้อมูลคำสั่งผลิตบางรายการมีความคลาดเคลื่อนเกี่ยวกับจำนวน วัสดุ และกำหนดส่งมอบ ส่วนการวางแผนการผลิตต้องอาศัยข้อมูลความพร้อมของวัตถุดิบ เครื่องจักร ลำดับงาน และประสบการณ์ของบุคลากรประกอบกัน","k":"p"},{"t":"4.2.1 ผลการวิเคราะห์ความต้องการของระบบ","k":"h"},{"t":"จากการวิเคราะห์ข้อมูล ผู้วิจัยสังเคราะห์ความต้องการที่สำคัญของระบบ ดังนี้","k":"p"},{"t":"1. ระบบสามารถรับและตรวจสอบความครบถ้วนของข้อมูลคำสั่งงาน","k":"p"},{"t":"2. ระบบสามารถเรียกใช้ข้อมูลที่เกี่ยวข้องจาก ERP","k":"p"},{"t":"3. ระบบสามารถสนับสนุนการคำนวณและจัดทำข้อมูลสำหรับใบเสนอราคา","k":"p"},{"t":"4. ระบบสามารถตรวจสอบความพร้อมของวัตถุดิบ","k":"p"},{"t":"5. ระบบสามารถสนับสนุนการจัดทำแผนการผลิตเบื้องต้น","k":"p"},{"t":"6. ระบบสามารถแจ้งข้อมูลที่ขาดหายหรือผิดเงื่อนไข","k":"p"},{"t":"7. ระบบรองรับการใช้งานภาษาไทย","k":"p"},{"t":"8. ผลลัพธ์สำคัญสามารถตรวจสอบและยืนยันโดยผู้ใช้งานก่อนนำไปใช้","k":"p"},{"t":"ผลการศึกษาดังกล่าวถูกนำไปใช้เป็นข้อกำหนดสำหรับการออกแบบและพัฒนาระบบต้นแบบในระยะต่อไป","k":"p"}],"no":"4.2","pdf":47,"pdfEnd":48,"book":38,"bookEnd":39,"toc":39,"cites":[],"q":"ผลการศึกษาสภาพปัญหาตอบวัตถุประสงค์ข้อที่ 1 หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 39 แต่หัวข้อนี้เริ่มจริงที่หน้า 38"}]},{"id":"c4-3","title":"4.3 ผลการออกแบบและพัฒนาระบบต้นแบบ AI Agent ERP","group":"บทที่ 4 ผลการวิจัย","ch":4,"paras":[{"t":"จากผลการวิเคราะห์ปัญหาและความต้องการ ผู้วิจัยได้ออกแบบและพัฒนาระบบต้นแบบ AI Agent ERP โดยกำหนดให้ AI Agent ทำหน้าที่ประสานการทำงานระหว่างผู้ใช้งาน ข้อมูลจาก ERP กฎทางธุรกิจ เครื่องมือคำนวณ และฐานความรู้ขององค์การ","k":"p"},{"t":"ระบบต้นแบบประกอบด้วย 5 โมดูลหลัก ดังตารางที่ 4.2","k":"p"},{"t":"ตารางที่ 4.2 องค์ประกอบของระบบต้นแบบ AI Agent ERP","k":"cap"},{"t":"โมดูล หน้าที่","k":"row"},{"t":"Order Intake and Specification รับและตรวจสอบข้อกำหนดของงาน","k":"row"},{"t":"Quotation Generator เรียกใช้ข้อมูลต้นทุนและสนับสนุนการคำนวณราคา","k":"row"},{"t":"Material Availability ตรวจสอบความพร้อมของวัตถุดิบ","k":"row"},{"t":"Production Planning จัดทำแผนการผลิตเบื้องต้น","k":"row"},{"t":"Human-in-the-loop ให้ผู้ใช้งานตรวจสอบ ยืนยัน หรือแก้ไขผลลัพธ์","k":"row"},{"t":"กระบวนการทำงานของระบบเริ่มจากการรับข้อมูลข้อกำหนดของงาน ตรวจสอบความครบถ้วนของข้อมูล เรียกใช้ข้อมูลจาก ERP และเครื่องมือที่เกี่ยวข้อง ประมวลผลตามกฎและเงื่อนไขทางธุรกิจ จัดทำผลลัพธ์เบื้องต้น และส่งผลลัพธ์ให้ผู้ใช้งานตรวจสอบก่อนนำไปใช้","k":"p"},{"t":"ระบบจึงมิได้กำหนดให้ AI เป็นผู้ตัดสินใจโดยอัตโนมัติในทุกขั้นตอน แต่ใช้ AI Agent เป็นกลไกสนับสนุนการประสานข้อมูลและกระบวนการ โดยยังคงการตรวจสอบของผู้ปฏิบัติงานสำหรับผลลัพธ์ที่เกี่ยวข้องกับราคา ข้อมูลคำสั่งผลิต และการวางแผนการผลิต","k":"p"},{"t":"4.3.1 กลไกการทำงานของระบบต้นแบบ","k":"h"},{"t":"เพื่อให้เข้าใจการทำงานของระบบต้นแบบ AI Agent ERP ในภาพรวม ผู้วิจัยอธิบายกลไกการทำงานเป็นลำดับขั้นตอนตั้งแต่รับคำสั่งงานจนได้ผลลัพธ์ที่ผู้ใช้งานสามารถนำไปใช้ได้ โดยอ้างอิงองค์ประกอบห้าโมดูลตามตารางที่ 4.2 และการออกแบบที่กำหนดให้มีผู้ใช้งานตรวจสอบผลลัพธ์สำคัญก่อนนำไปใช้จริง","k":"p"},{"t":"ขั้นตอนที่ 1 รับคำสั่งงานพิมพ์จากลูกค้า ระบบรับข้อกำหนดของงานผ่านโมดูล Order Intake and Specification ได้แก่ ขนาด จำนวน สี วัสดุ และเงื่อนไขอื่นที่เกี่ยวข้อง จากนั้นตรวจสอบความครบถ้วนของข้อมูล หากข้อมูลไม่ครบหรือไม่สอดคล้องกับเงื่อนไขที่กำหนด ระบบจะแจ้งให้ผู้ใช้งานทราบเพื่อแก้ไขก่อนเข้าสู่ขั้นตอนถัดไป","k":"p"},{"t":"ขั้นตอนที่ 2 ดึงข้อมูลจากระบบวางแผนทรัพยากรองค์กรโดยอัตโนมัติ เมื่อข้อมูลข้อกำหนดครบถ้วน เอเจนต์จะเรียกใช้ข้อมูลที่เกี่ยวข้องจากระบบ ERP ขององค์การ เช่น ข้อมูลต้นทุน ราคาวัสดุ และข้อมูลที่เกี่ยวข้องกับงานพิมพ์ ตามสิทธิ์และแหล่งข้อมูลที่กำหนดไว้ล่วงหน้า ขั้นตอนนี้มุ่งลดการค้นหาและคัดลอกข้อมูลด้วยตนเองจากหลายแหล่งในกระบวนการเดิม","k":"p"},{"t":"ขั้นตอนที่ 3 คำนวณและจัดทำข้อมูลสำหรับใบเสนอราคา โมดูล Quotation Generator ประมวลผลตามกฎทางธุรกิจ สูตรคำนวณ และเงื่อนไขที่เกี่ยวข้อง เพื่อจัดทำข้อมูลราคารวม ภาษี และส่วนลดสำหรับใบเสนอราคาเบื้องต้น โดยผลลัพธ์ยังอยู่ในสถานะรอการตรวจสอบจากผู้ใช้งานตามหลัก Human-in-the-loop","k":"p"},{"t":"ขั้นตอนที่ 4 ตรวจสอบความสอดคล้องของข้อมูลคำสั่งผลิตกับความพร้อมด้านวัสดุและการผลิต โมดูล Material Availability และ Production Planning ใช้ข้อมูลจาก ERP และข้อกำหนดของงานเพื่อตรวจสอบความพร้อมของวัตถุดิบ และจัดทำข้อมูลสนับสนุนการวางแผนการผลิตเบื้องต้น รวมถึงการตรวจสอบความสอดคล้องของข้อมูลคำสั่งผลิตกับเงื่อนไขที่กำหนด หากพบข้อมูลขาดหายหรือผิดเงื่อนไข ระบบจะแจ้งผู้ใช้งานให้ดำเนินการก่อนยืนยันผลลัพธ์","k":"p"},{"t":"ขั้นตอนที่ 5 ส่งผลลัพธ์กลับสู่ผู้ใช้งาน ระบบนำเสนอผลลัพธ์ในรูปข้อมูลสำหรับใบเสนอราคา และแผนการผลิตเบื้องต้น ให้ผู้ใช้งานตรวจสอบ ยืนยัน หรือแก้ไขก่อนนำไปใช้ในกระบวนการจริง ระบบจึงไม่ได้กำหนดให้ปัญญาประดิษฐ์ตัดสินใจแทนผู้ปฏิบัติงานในทุกกรณี แต่ทำหน้าที่ประสานข้อมูล กระบวนการ และกฎทางธุรกิจให้เชื่อมโยงกันภายในลำดับขั้นตอนเดียว","k":"p"},{"t":"จุดต่างจากระบบเดิม ในกระบวนการเดิม ผู้ปฏิบัติงานต้องเปิดใช้ข้อมูลจากหลายส่วน ค้นหาข้อมูลต้นทุนและวัสดุด้วยตนเอง คำนวณราคา และตรวจสอบความถูกต้องของข้อมูลคำสั่งผลิตและการวางแผนแยกเป็นขั้นตอน ซึ่งใช้เวลาและเปิดโอกาสให้เกิดความคลาดเคลื่อนจากการเชื่อมโยงข้อมูลด้วยมือ ระบบต้นแบบจึงออกแบบให้เอเจนต์ดำเนินการรับข้อมูล เรียกใช้ข้อมูลจาก ERP คำนวณ และตรวจสอบเบื้องต้นในลำดับต่อเนื่องเดียวกัน แล้วจึงส่งผลให้ผู้ใช้งานยืนยัน ลักษณะดังกล่าวสอดคล้องกับผลการเปรียบเทียบก่อนและหลังการใช้ระบบในหัวข้อ 4.6 ที่พบว่าเวลาในการออกใบเสนอราคาลดลงร้อยละ 64.31 ความถูกต้องของข้อมูลคำสั่งผลิตเพิ่มขึ้น และค่าส่วนเบี่ยงเบนมาตรฐานของตัวชี้วัดหลังใช้ระบบต่ำกว่าช่วงก่อนใช้ ซึ่งสะท้อนว่าผลลัพธ์มีแนวโน้มนิ่งขึ้นภายใต้เงื่อนไขของการศึกษาครั้งนี้","k":"p"},{"t":"4.3.2 วิธีเก็บข้อมูลและวัดเวลา","k":"h"},{"t":"ผู้วิจัยกำหนดวิธีเก็บข้อมูลและวัดผลเพื่อสนับสนุนการเปรียบเทียบก่อนและหลังการใช้ระบบต้นแบบ AI Agent ERP ตามตัวชี้วัดที่กำหนดในการวิจัย โดยแยกหน่วยวิเคราะห์ระดับงานออกจากการประเมินความพึงพอใจระดับบุคคล","k":"p"},{"t":"กลุ่มตัวอย่างระดับงาน ใช้บิลงานพิมพ์จริงจำนวน 30 คู่ (before-after) จากบิลย้อนหลัง 3 เดือนของโรงพิมพ์กรณีศึกษา แต่ละคู่ประกอบด้วยการวัดผลการดำเนินงานก่อนใช้ระบบและการวัดซ้ำหลังใช้ระบบต้นแบบบนบิลชุดเดียวกัน เพื่อให้การเปรียบเทียบสะท้อนความแตกต่างของกระบวนการภายใต้ข้อกำหนดงานที่เทียบเคียงกันได้","k":"p"},{"t":"จำนวนคู่ดังกล่าวสอดคล้องกับองศาอิสระ df = 29 ที่ใช้ในการทดสอบ Paired Samples t-test ในหัวข้อ 4.6","k":"p"},{"t":"วิธีวัดเวลา ใช้การจับเวลาจริงตั้งแต่เริ่มรับข้อกำหนดหรือสเปกของงานจนได้ใบเสนอราคาที่สมบูรณ์ในรอบการวัดนั้น","k":"p"},{"t":"การวัดก่อนใช้ระบบดำเนินการตามกระบวนการเดิมด้วยวิธีปฏิบัติงานด้วยตนเอง (manual) ส่วนการวัดหลังใช้ระบบดำเนินการบนบิลชุดเดียวกันโดยใช้ระบบต้นแบบ AI Agent ERP เป็นเครื่องมือสนับสนุน แล้วจึงบันทึกเวลาหลังใช้ระบบ","k":"p"},{"t":"หลักการเดียวกันนี้ใช้ประกอบการเก็บข้อมูลตัวชี้วัดอื่นที่เกี่ยวข้องกับข้อมูลคำสั่งผลิตและการจัดทำแผนการผลิตเบื้องต้นตามนิยามที่ใช้ในการวิจัย","k":"p"},{"t":"ตัวแปรที่วัดในการเปรียบเทียบก่อนและหลังการใช้ระบบประกอบด้วย 3 รายการ ได้แก่ (1) เวลาในการออกใบเสนอราคา มีหน่วยเป็นนาที (2) ความถูกต้องของข้อมูลคำสั่งผลิต มีหน่วยเป็นร้อยละ และ (3) เวลาในการจัดทำแผนการผลิตเบื้องต้น มีหน่วยเป็นนาที ผลการวิเคราะห์เชิงสถิติของตัวแปรทั้งสามนำเสนอในหัวข้อ 4.6","k":"p"},{"t":"จุดสำคัญเชิงวิธีวิทยาคือ ระบบต้นแบบออกแบบให้เอเจนต์เรียกใช้ข้อมูลจาก ERP และประมวลผลตามกฎและสูตรที่กำหนดในลำดับขั้นตอนเดียวกัน จึงมีแนวโน้มให้ผลลัพธ์และเวลาดำเนินงานมีความสม่ำเสมอมากขึ้น แม้ผู้สั่งงานหรือผู้ใช้งานจะแตกต่างกัน กลไกของระบบช่วยลดการพึ่งพาความชำนาญรายบุคคลเมื่อเทียบกับกระบวนการเดิมที่เวลาและความถูกต้องมักแปรผันตามประสบการณ์และการค้นหาข้อมูลด้วยตนเองของแต่ละคน รายละเอียดผลการเปรียบเทียบนำเสนอในหัวข้อ 4.6","k":"p"},{"t":"ส่วนการประเมินความพึงพอใจของผู้ใช้กลุ่มทดลอง 20 คนเป็นหน่วยวิเคราะห์ระดับบุคคลต่างหาก ตามหัวข้อ 4.7","k":"p"},{"t":"4.3.3 วิธีวัดความถูกต้องข้อมูลคำสั่งผลิต","k":"h"},{"t":"(เนื้อหาส่วนนี้ปรากฏในหัวข้อ 3.3.5 และ 4.3.3 โดยมีรายละเอียดเกี่ยวกับการตรวจสอบความถูกต้องระดับใบสั่งผลิต)","k":"p"},{"t":"ตารางที่ 4.2ก อัตราความผิดพลาดระดับใบส่งผลิต (n = 30)","k":"cap"},{"t":"รายการ ฝั่งก่อนใช้ระบบ (ระบบเดิม) ฝั่งหลังใช้ระบบ (AI Agent ERP)","k":"row"},{"t":"จำนวนบิลทั้งหมด 30 30","k":"row"},{"t":"บิลที่ผ่าน (ถูกต้องครบถ้วน) 26.55 29.34","k":"row"},{"t":"บิลที่มีข้อผิดพลาดอย่างน้อย 1 จุด 3.45 0.66","k":"row"},{"t":"ร้อยละความถูกต้อง (บิลที่ผ่าน) 88.50 97.80","k":"row"},{"t":"ร้อยละความผิดพลาด (บิลที่ไม่ผ่าน) 11.50 2.20","k":"row"},{"t":"หมายเหตุ: ตัวเลขบิลที่ผ่านคำนวณกลับจากร้อยละความถูกต้องเฉลี่ยของ 30 บิล (ร้อยละ 88.50 และ 97.80) จึงปรากฏทศนิยม หน่วยวิเคราะห์หลักของสมมติฐาน H2 คือร้อยละความถูกต้องรายบิลตามนิยามผ่าน-ไม่ผ่าน ความผิดพลาดร้อยละ 11.50 เดิมเกิดจากมีบิลบางใบที่มีข้อผิดพลาดในการบันทึกข้อมูล แม้เพียงจุดเดียวก็ถือว่าบิลนั้นไม่ผ่าน หลังใช้ระบบต้นแบบลดเหลือร้อยละ 2.20 เพร พิ่มประสิทธิภาพการเสนอราคาและการวางแผนผลิตในอุตสาหกรรมพิมพ์บรรจุภัณฑ์ เป็นการวิจัยและพัฒนา โดยประยุกต์แนวคิด Design Science Research ในกระบวนการออกแบบ พัฒนา และประเมินระบบ มีวัตถุประสงค์ 3 ประการ ได้แก่ การศึกษาสภาพปัญหาและความต้องการ การออกแบบและพัฒนาระบบต้นแบบ และการประเมินความเหมาะสมและผลการใช้งานระบบ","k":"p"},{"t":"การดำเนินการวิจัยแบ่งออกเป็น 3 ระยะ คือ การศึกษาสภาพปัญหาและความต้องการ การออกแบบและพัฒนาระบบ และการทดลองใช้และประเมินผล","k":"p"}],"pdf":63,"pdfEnd":63,"book":54,"bookEnd":54,"toc":55,"cites":[],"q":"บทที่ 5 ทบทวนวัตถุประสงค์และวิธีวิจัยโดยย่อชัดเจนหรือไม่","fd":[{"lv":"ตรวจ","t":"บทนี้เริ่มต่อท้ายหน้าเดิม ไม่ขึ้นหน้าใหม่ ควรตรวจกับรูปแบบเล่มของบัณฑิตวิทยาลัย"},{"lv":"แก้","t":"สารบัญระบุหน้า 55 แต่หัวข้อนี้เริ่มจริงที่หน้า 54"}]},{"id":"c5-1","title":"5.1 สรุปผลการวิจัย","group":"บทที่ 5 สรุปผล อภิปรายผล และข้อเสนอแนะ","ch":5,"paras":[{"t":"5.1.1 ผลการศึกษาสภาพปัญหาและความต้องการ","k":"h"},{"t":"ผลการศึกษาพบว่า กระบวนการรับงาน การเสนอราคา และการวางแผนการผลิตของโรงพิมพ์กรณีศึกษามีประเด็นปัญหาสำคัญ ได้แก่ การจัดทำใบเสนอราคาใช้เวลานาน ความคลาดเคลื่อนของข้อมูลคำสั่งผลิต การวางแผนการผลิตที่ต้องอาศัยข้อมูลจากหลายส่วน และความรู้สำคัญบางส่วนที่ผูกติดกับประสบการณ์ของบุคลากร","k":"p"},{"t":"ผลการวิเคราะห์ความต้องการนำไปสู่การกำหนดองค์ประกอบของระบบที่สามารถรับและตรวจสอบข้อกำหนดของงาน เชื่อมโยงข้อมูลจาก ERP สนับสนุนการคำนวณราคา ตรวจสอบความพร้อมของวัตถุดิบ และจัดทำแผนการผลิตเบื้องต้น โดยมีผู้ใช้งานตรวจสอบและยืนยันผลลัพธ์สำคัญก่อนนำไปใช้","k":"p"},{"t":"5.1.2 ผลการออกแบบและพัฒนาระบบ","k":"h"},{"t":"ระบบต้นแบบ AI Agent ERP ที่พัฒนาขึ้นประกอบด้วย 5 โมดูล ได้แก่ Order Intake and Specification, Quotation Generator, Material Availability, Production Planning และ Human-in-the-loop","k":"p"},{"t":"ระบบใช้ AI Agent เป็นกลไกในการประสานข้อมูลและกระบวนการ โดยเชื่อมโยงกับข้อมูล ERP กฎทางธุรกิจ สูตรคำนวณ และความรู้ที่ได้รับการจัดโครงสร้างจากกระบวนการปฏิบัติงาน","k":"p"},{"t":"ผลการประเมินโดยผู้เชี่ยวชาญพบว่า ระบบมีความเหมาะสมโดยรวมอยู่ในระดับมาก มีค่าเฉลี่ย 4.50 และ SD = 0.47","k":"p"},{"t":"5.1.3 ผลการทดลองใช้ระบบ","k":"h"},{"t":"ภายหลังการใช้ระบบพบว่า เวลาเฉลี่ยในการออกใบเสนอราคาลดลงจาก 52.40 นาที เป็น 18.70 นาที หรือลดลงร้อยละ 64.31","k":"p"},{"t":"ความถูกต้องของข้อมูลคำสั่งผลิตเพิ่มขึ้นจาก ร้อยละ 88.50 เป็นร้อยละ 97.80 หรือเพิ่มขึ้น 9.30 จุดร้อยละ","k":"p"},{"t":"เวลาเฉลี่ยในการจัดทำแผนการผลิตลดลงจาก 38.60 นาที เป็น 14.20 นาที หรือลดลงร้อยละ 63.21","k":"p"},{"t":"ผลการทดสอบทางสถิติของตัวชี้วัดทั้ง 3 ด้านมีนัยสำคัญทางสถิติที่ระดับ .05 และสนับสนุนสมมติฐานการวิจัยทั้ง 3 ข้อ","k":"p"},{"t":"ผลการประเมินความพึงพอใจของผู้ใช้งานมีค่าเฉลี่ยโดยรวม 4.58 (SD = 0.47) อยู่ในระดับมากที่สุด","k":"p"}],"no":"5.1","pdf":63,"pdfEnd":64,"book":54,"bookEnd":55,"toc":56,"cites":[],"q":"สรุปผลการวิจัยตอบวัตถุประสงค์ครบทั้ง 3 ข้อหรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 56 แต่หัวข้อนี้เริ่มจริงที่หน้า 54"}]},{"id":"c5-2","title":"5.2 อภิปรายผล","group":"บทที่ 5 สรุปผล อภิปรายผล และข้อเสนอแนะ","ch":5,"paras":[{"t":"5.2.1 การเชื่อมโยงข้อมูล กระบวนการ และความรู้เป็นองค์ประกอบสำคัญของการพัฒนาระบบ","k":"h"},{"t":"ผลการศึกษาพบว่าปัญหาของกระบวนการเดิมไม่ได้เกิดจากปัจจัยด้านเทคโนโลยีเพียงประการเดียว แต่เกี่ยวข้องกับการกระจายตัวของข้อมูล ขั้นตอนการทำงาน และการพึ่งพาความรู้จากประสบการณ์ของบุคลากร","k":"p"},{"t":"ผลดังกล่าวสามารถอภิปรายเชื่อมโยงกับแนวคิด ERP ของ O'Leary (2000) ซึ่งให้ความสำคัญกับการบูรณาการข้อมูลและกระบวนการภายในองค์การ การนำ ERP มาเป็นโครงสร้างพื้นฐานด้านข้อมูลจึงช่วยให้ระบบสามารถเรียกใช้ข้อมูลที่เกี่ยวข้องกับลูกค้า ต้นทุน วัตถุดิบ และการผลิตจากแหล่งข้อมูลที่กำหนด","k":"p"},{"t":"อย่างไรก็ตาม ผลการศึกษายังสะท้อนว่า การมีข้อมูลอยู่ใน ERP เพียงอย่างเดียวไม่สามารถแก้ปัญหาทั้งหมดได้ เนื่องจากกระบวนการบางส่วนต้องอาศัยการตีความเงื่อนไขของงาน การตรวจสอบข้อมูล และความรู้จากประสบการณ์ของบุคลากร","k":"p"},{"t":"ระบบที่พัฒนาขึ้นจึงใช้ AI Agent เป็นกลไกสนับสนุนการเชื่อมโยงข้อมูล กระบวนการ และกฎทางธุรกิจ มากกว่าการใช้ AI เพื่อทดแทน ERP หรือการตัดสินใจของบุคลากรทั้งหมด","k":"p"},{"t":"5.2.2 การจัดการความรู้กับการพัฒนาระบบ","k":"h"},{"t":"ผลการศึกษาพบว่า ความรู้บางส่วนเกี่ยวกับต้นทุน วัสดุ เงื่อนไขการผลิต และการวางแผนงานอยู่ในรูปของประสบการณ์ของบุคลากร","k":"p"},{"t":"กระบวนการพัฒนาระบบจึงมีการรวบรวมและถ่ายทอดความรู้ดังกล่าวให้อยู่ในรูปของกฎ สูตร เงื่อนไข และขั้นตอนที่สามารถเชื่อมโยงกับระบบได้","k":"p"},{"t":"กระบวนการดังกล่าวสามารถอธิบายเชื่อมโยงกับแบบจำลอง SECI ของ Nonaka และ Takeuchi (1995) โดยเฉพาะกระบวนการ Externalization ซึ่งเป็นการเปลี่ยนความรู้ฝังลึกให้เป็นความรู้ชัดแจ้ง และ Combination ซึ่งเป็นการเชื่อมโยงความรู้ชัดแจ้งจากหลายแหล่งเข้าด้วยกัน","k":"p"},{"t":"อย่างไรก็ตาม การวิจัยครั้งนี้มิได้มีวัตถุประสงค์เพื่อทดสอบแบบจำลอง SECI ในเชิงสถิติ ดังนั้น ผลการศึกษาแสดงถึงการนำแนวคิดดังกล่าวมาใช้เป็นกรอบอธิบายกระบวนการจัดการความรู้ในการพัฒนาระบบ มิใช่การยืนยันความสัมพันธ์เชิงสาเหตุขององค์ประกอบในแบบจำลอง SECI","k":"p"},{"t":"5.2.3 ผลด้านเวลาในการออกใบเสนอราคา","k":"h"},{"t":"ภายหลังการใช้ระบบต้นแบบ เวลาเฉลี่ยในการออกใบเสนอราคาลดลงจาก 52.40 นาที เป็น 18.70 นาที หรือลดลงร้อยละ 64.31 และผลการเปรียบเทียบมีนัยสำคัญทางสถิติ","k":"p"},{"t":"ลักษณะการทำงานของระบบที่สามารถตรวจสอบข้อมูล เรียกใช้ข้อมูลที่เกี่ยวข้อง และประมวลผลตามกฎและสูตรที่กำหนด อาจเป็นปัจจัยหนึ่งที่สนับสนุนให้กระบวนการจัดทำใบเสนอราคาดำเนินการได้รวดเร็วยิ่งขึ้น เนื่องจากลดขั้นตอนการค้นหาและเชื่อมโยงข้อมูลด้วยวิธีการเดิม","k":"p"},{"t":"ผลดังกล่าวสอดคล้องในเชิงแนวคิดกับบทบาทของ ERP ในการบูรณาการข้อมูลและแนวคิด AI Agent ที่สามารถประสานการใช้ข้อมูลและเครื่องมือหลายส่วนภายในกระบวนการเดียว อย่างไรก็ตาม การศึกษาครั้งนี้เป็นการศึกษาในบริบทของโรงพิมพ์กรณีศึกษา จึงควรตีความผลภายใต้เงื่อนไขของกระบวนการ ข้อมูล และระบบสารสนเทศขององค์การที่ศึกษา","k":"p"},{"t":"5.2.4 ผลด้านความถูกต้องของข้อมูลคำสั่งผลิต","k":"h"},{"t":"ภายหลังการใช้ระบบ ความถูกต้องของข้อมูลคำสั่งผลิตเพิ่มขึ้นจากร้อยละ 88.50 เป็นร้อยละ 97.80 หรือเพิ่มขึ้น 9.30 จุดร้อยละ และผลการเปรียบเทียบมีนัยสำคัญทางสถิติ","k":"p"},{"t":"ผลดังกล่าวสะท้อนว่า กระบวนการตรวจสอบความครบถ้วน การใช้ข้อมูลจากแหล่งที่กำหนด และการประมวลผลตามกฎทางธุรกิจสามารถนำมาใช้สนับสนุนการลดความคลาดเคลื่อนของข้อมูลได้","k":"p"},{"t":"การกำหนด Human-in-the-loop ยังทำให้ผลลัพธ์สำคัญต้องผ่านการตรวจสอบและยืนยันจากผู้ใช้งานก่อนนำไปใช้ ซึ่งเป็นกลไกที่ช่วยลดความเสี่ยงจากการใช้ผลลัพธ์ของ AI โดยไม่มีการตรวจสอบ","k":"p"},{"t":"แนวทางดังกล่าวสอดคล้องกับหลักการบริหารความเสี่ยงของระบบ AI ที่ให้ความสำคัญกับการกำกับดูแล การตรวจสอบ และความรับผิดชอบของผู้เกี่ยวข้องในการใช้ระบบ","k":"p"},{"t":"5.2.5 ผลด้านเวลาในการจัดทำแผนการผลิต","k":"h"},{"t":"ภายหลังการใช้ระบบ เวลาเฉลี่ยในการจัดทำแผนการผลิตลดลงจาก 38.60 นาที เป็น 14.20 นาที หรือลดลงร้อยละ 63.21 และผลการเปรียบเทียบมีนัยสำคัญทางสถิติ","k":"p"},{"t":"ผลดังกล่าวสามารถอธิบายได้ว่า ระบบช่วยรวบรวมและเชื่อมโยงข้อมูลที่จำเป็นต่อการวางแผน เช่น ข้อมูลวัตถุดิบ ข้อกำหนดของงาน และข้อมูลการผลิต ทำให้ผู้ปฏิบัติงานสามารถใช้ข้อมูลประกอบการจัดทำแผนเบื้องต้นได้โดยลดขั้นตอนการค้นหาและประสานข้อมูลด้วยวิธีการเดิม","k":"p"},{"t":"อย่างไรก็ตาม ระบบที่พัฒนาขึ้นทำหน้าที่สนับสนุนการจัดทำแผนการผลิตเบื้องต้น มิได้ทำหน้าที่ควบคุมหรือกำหนดแผนการผลิตจริงโดยปราศจากการตรวจสอบของผู้รับผิดชอบ","k":"p"},{"t":"5.2.6 ความเหมาะสมและความพึงพอใจต่อระบบ","k":"h"},{"t":"ผู้เชี่ยวชาญประเมินความเหมาะสมของระบบโดยรวมอยู่ในระดับมาก มีค่าเฉลี่ย 4.50 ขณะที่ผู้ใช้งานประเมินความพึงพอใจโดยรวมอยู่ในระดับมากที่สุด มีค่าเฉลี่ย 4.58","k":"p"},{"t":"เมื่อพิจารณารายด้าน พบว่าด้านประโยชน์ที่ได้รับมีค่าเฉลี่ยความพึงพอใจสูงที่สุด ขณะที่ด้านความง่ายในการใช้งานมีค่าเฉลี่ยต่ำกว่าด้านอื่น แม้ยังอยู่ในระดับมาก","k":"p"},{"t":"ผลดังกล่าวสะท้อนให้เห็นว่า ผู้ใช้งานรับรู้ถึงประโยชน์ของระบบต่อกระบวนการทำงาน ขณะเดียวกันการออกแบบส่วนติดต่อและกระบวนการใช้งานยังเป็นประเด็นที่สามารถพัฒนาต่อไปได้","k":"p"},{"t":"5.2.7 การอภิปรายในมิติของการบริหารการพัฒนา","k":"h"},{"t":"เมื่อพิจารณาในมิติของการบริหารการพัฒนา ผลการศึกษาสะท้อนให้เห็นว่าการนำเทคโนโลยีมาใช้ในการพัฒนาองค์การจำเป็นต้องพิจารณามากกว่าตัวเทคโนโลยี โดยต้องเชื่อมโยงบุคลากร กระบวนการ ข้อมูล ความรู้ และระบบสารสนเทศเข้าด้วยกัน","k":"p"},{"t":"ระบบ AI Agent ERP ในการศึกษาครั้งนี้จึงทำหน้าที่เป็นเครื่องมือสนับสนุนการพัฒนากระบวนการขององค์การ โดยนำข้อมูลและความรู้ที่มีอยู่มาจัดโครงสร้างและเชื่อมโยงกับการปฏิบัติงาน","k":"p"},{"t":"เมื่อพิจารณาตามแนวคิดองค์การในฐานะระบบเปิด กระบวนการดังกล่าวสามารถอธิบายได้ในลักษณะของปัจจัยนำเข้า กระบวนการ ผลผลิต และข้อมูลย้อนกลับ โดยผลจากการทดลองใช้และความคิดเห็นของผู้ใช้งานสามารถนำกลับไปใช้ประกอบการปรับปรุงระบบและกระบวนการต่อไป","k":"p"},{"t":"ทั้งนี้ การวิจัยไม่ได้มีวัตถุประสงค์เพื่อทดสอบทฤษฎีระบบเปิดโดยตรง จึงใช้แนวคิดดังกล่าวเพื่ออธิบายความสัมพันธ์ขององค์ประกอบภายในกระบวนการพัฒนาองค์การเท่านั้น","k":"p"}],"no":"5.2","pdf":65,"pdfEnd":69,"book":56,"bookEnd":60,"toc":58,"cites":[5,4],"q":"การอภิปรายผลเชื่อมกลับไปยังทฤษฎีและงานวิจัยในบทที่ 2 หรือไม่","fd":[{"lv":"แก้","t":"สารบัญระบุหน้า 58 แต่หัวข้อนี้เริ่มจริงที่หน้า 56"}]},{"id":"c5-3","title":"5.3 ข้อจำกัดของการวิจัย","group":"บทที่ 5 สรุปผล อภิปรายผล และข้อเสนอแนะ","ch":5,"paras":[{"t":"การวิจัยครั้งนี้มีข้อจำกัดที่ควรนำมาประกอบการตีความผล ดังนี้","k":"p"},{"t":"1. เป็นการศึกษาในโรงพิมพ์กรณีศึกษาแห่งเดียว จึงไม่ควรนำผลไปสรุปแทนโรงพิมพ์ทั้งหมดโดยตรง","k":"p"},{"t":"2. การทดลองใช้ระบบดำเนินการในระยะเวลา 4 สัปดาห์ จึงสะท้อนผลการใช้งานภายในช่วงเวลาที่กำหนด","k":"p"},{"t":"3. ผลของระบบขึ้นอยู่กับคุณภาพและความพร้อมของข้อมูลจาก ERP และข้อมูลที่ใช้ในกระบวนการของโรงพิมพ์กรณีศึกษา","k":"p"},{"t":"4. ระบบต้นแบบครอบคลุมเฉพาะกระบวนการรับงาน การเสนอราคา การตรวจสอบความพร้อมของวัตถุดิบ และการวางแผนการผลิตเบื้องต้น ไม่ครอบคลุมกระบวนการ ERP ทั้งองค์การหรือการควบคุมเครื่องจักรจริง","k":"p"},{"t":"5. ผลการเปรียบเทียบก่อนและหลังแสดงความแตกต่างที่เกิดขึ้นภายใต้เงื่อนไขของการศึกษาครั้งนี้ จึงควรระมัดระวังการตีความในลักษณะความสัมพันธ์เชิงสาเหตุโดยตรง","k":"p"}],"no":"5.3","pdf":70,"pdfEnd":70,"book":61,"bookEnd":61,"toc":62,"cites":[],"q":"ข้อจำกัดของการวิจัยระบุอย่างตรงไปตรงมาหรือไม่","fd":[{"lv":"ตรวจ","t":"ช่วงหลังใช้ระบบวัดจากการประมวลผลซ้ำบิลย้อนหลัง 3 เดือน แต่หลายหัวข้อระบุการทดลองใช้ 4 สัปดาห์ ควรเขียนให้ชัดว่าค่า \"หลังใช้ระบบ\" ได้จากการใช้งานจริงหรือการประมวลผลซ้ำบิลเดิม"},{"lv":"แก้","t":"สารบัญระบุหน้า 62 แต่หัวข้อนี้เริ่มจริงที่หน้า 61"}]},{"id":"c5-4","title":"5.4 ข้อเสนอแนะจากผลการ /* ---------- state & storage ---------- */
const S={reviews:{},notes:[],events:[]};
let db=null, online=false;
const LS='thesisdesk.v1';
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){S.reviews=v.reviews||{};S.notes=v.notes||[];S.events=v.events||[];}}catch(e){}}
function lsSave(){if(online)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

try{role=localStorage.getItem('thesisdesk.role')||'อาจารย์'}catch(e){}
function setRole(r){role=r;try{localStorage.setItem('thesisdesk.role',r)}catch(e){}

function rev(id){return S.reviews[id]||{status:null,marks:{}}}
async function saveReview(id,patch){
  const r=Object.assign({status:null,marks:{}},rev(id),patch,{at:Date.now(),by:role});
  S.reviews[id]=r; lsSave(); renderAll();
  if(db){try{await db.doc('reviews/'+id).set(r)}catch(e){toast('บันทึกไม่สำเร็จ: '+(e.message||e.code))}}
}
async function addNote(n){
  n=Object.assign({at:Date.now(),by:role,done:false},n);
  if(db){try{await db.collection('notes').add(n);toast('บันทึกข้อเสนอแนะแล้ว');return}catch(e){toast('บันทึกไม่สำเร็จ: '+(e.message||e.code));return}}
  n._id='l'+Date.now();S.notes.push(n);lsSave();renderAll();toast('บันทึกข้อเสนอแนะแล้ว');
}
async function updNote(id,patch){
  const n=S.notes.find(x=>x._id===id); if(!n)return; Object.assign(n,patch); lsSave(); renderAll();
  if(db){const c=Object.assign({},n);delete c._id;try{await db.doc('notes/'+id).set(c)}catch(e){toast('บันทึกไม่สำเร็จ')}}
}
async function delNote(id){
  S.notes=S.notes.filter(x=>x._id!==id);lsSave();renderAll();
  if(db){try{await db.doc('notes/'+id).delete()}catch(e){toast('ลบไม่สำเร็จ')}}
}
async function addEvent(e){
  if(db){try{await db.collection('events').add(e);toast('เพิ่มนัดหมายแล้ว');return}catch(x){toast('บันทึกไม่สำเร็จ');return}}
  e._id='l'+Date.now();S.events.push(e);lsSave();renderAll();toast('เพิ่มนัดหมายแล้ว');
}
async function delEvent(id){S.events=S.events.filter(x=>x._id!==id);lsSave();renderAll();if(db){try{await db.doc('events/'+id).delete()}catch(e){}}}

function setSync(on,txt){const el=$('#sync');el.classList.toggle('on',on);el.querySelector('span').textContent=txt}
lsLoad(); setSync(false,'บันทึกเฉพาะเครื่องนี้');
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const d=await claude.use('db'); if(!d)return;
    db=d; online=true; setSync(true,'บันทึกออนไลน์ เห็นร่วมกัน');

    db.collection('reviews').onSnapshot(q=>{const o={};q.docs.forEach(x=>o[x.id]=x.data());S.reviews=o;renderAll()},()=>setSync(false,'เชื่อมต่อไม่ได้'));
    db.collection('notes').onSnapshot(q=>{S.notes=q.docs.map(x=>Object.assign({_id:x.id},x.data()));renderAll()});

})();

/* ---------- status logic ---------- */
function status(id){
  const r=rev(id); if(r.status)return r.status;
  const m=Object.values(r.marks||{});
  if(m.includes('fix'))return 'fix';
  if(m.length)return 'part';
  return null;
}
function openNotes(id){return S.notes.filter(n=>n.item===id&&!n.done)}
function flagged(it){return (it.fd||[]).some(f=>f.lv!=='ผ่าน')}

/* ---------- UI state ---------- */
let tab='outline', cur={outline:'c1-1',steps:'s-1'}, filter='all', selPara=null;
try{const v=JSON.parse(localStorage.getItem('thesisdesk.ui')||'null');if(v){tab=v.tab||tab;cur=Object.assign(cur,v.cur||{})}}catch(e){}
function saveUI(){try{localStorage.setItem('thesisdesk.ui',JSON.stringify({tab,cur}))}catch(e){}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selPara=null;saveUI();renderAll()});
document.querySelectorAll('#filter button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#filter button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList()});
$('#mList').onclick=()=>$('#qcol').classList.toggle('open');
function curList(){return tab==='steps'?STEPS:ITEMS}
function go(id){
  if(id.startsWith('s-')){tab='steps';cur.steps=id}else{tab='outline';cur.outline=id}
  selPara=null;saveUI();renderAll();$('#acol').scrollTop=0;window.scrollTo(0,0);$('#qcol').classList.remove('open');
}
$('#mPrev').onclick=()=>step(-1);$('#mNext').onclick=()=>step(1);
function step(d){const L=curList(),i=L.findIndex(x=>x.id===cur[tab]);const n=L[Math.max(0,Math.min(L.length-1,i+d))];go(n.id)}

let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------- renderers ---------- */
function renderAll(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#deskView').hidden=!(tab==='outline'||tab==='steps');
  $('#calView').hidden=tab!=='cal'; $('#sumView').hidden=tab!=='sum';
  renderProgress();
  if(tab==='outline'||tab==='steps'){renderList();renderAnswer();renderSource();}
  if(tab==='cal')renderCal();
  if(tab==='sum')renderSum();
}
function renderProgress(){
  const all=ITEMS.length; let ok=0,fx=0;
  ITEMS.forEach(it=>{const s=status(it.id);if(s==='ok')ok++;else if(s==='fix')fx++});
  $('#progTxt').textContent=`ตรวจแล้ว ${ok+fx}/${all} หัวข้อ`;
  $('#progBar').innerHTML=`<i style="width:${ok/all*100}%;background:#4cd18a"></i><i style="width:${fx/all*100}%;background:#f0a33c"></i>`;
  const pend=S.notes.filter(n=>!n.done).length;$('#tabCnt').textContent=pend||'';$('#tabCnt').hidden=!pend;
}
function renderList(){
  const L=curList(); $('#qHead').textContent=tab==='steps'?'ขั้นตอนการวิจัย (คำถาม)':'โครงร่างการวิจัย (คำถาม)';
  let h='',g=null;
  L.forEach(it=>{
    const s=status(it.id), on=openNotes(it.id).length;
    if(filter==='todo'&&s)return; if(filter==='fix'&&s!=='fix'&&!on)return; if(filter==='flag'&&!flagged(it))return;
    if(tab==='outline'&&it.group!==g){g=it.group;const n=ITEMS.filter(x=>x.group===g),d=n.filter(x=>status(x.id)==='ok'||status(x.id)==='fix').length;h+=`<div class="grp"><b>${esc(g)}</b><span class="num">${d}/${n.length}</span></div>`}
    const title=tab==='steps'?`<span class="stepnum num">${it.n}</span> ${esc(it.title)}`:esc(it.title);
    h+=`<button class="qi" data-id="${it.id}" ${cur[tab]===it.id?'aria-current="true"':''}><span class="dot ${s||''}"></span><span><b>${title}</b><small>${esc(it.q)}</small>${on?`<small class="fix-t">ข้อเสนอแนะค้าง ${on} รายการ</small>`:''}</span></button>`;
  });
  $('#qlist').innerHTML=h||'<div class="empty" style="padding:16px">ไม่มีรายการตามตัวกรองนี้</div>';
  $('#qlist').querySelectorAll('.qi').forEach(b=>b.onclick=()=>go(b.dataset.id));
  const it=BYID[cur[tab]]; $('#mCur').textContent=it?(tab==='steps'?'ขั้นที่ '+it.n+' '+it.title:it.title):'';
}

  <button class="vbtn ok" data-v="ok" aria-pressed="${r.status==='ok'}">${IC.ok}ผ่าน</button>
  <button class="vbtn fix" data-v="fix" aria-pressed="${r.status==='fix'}">${IC.fix}ต้องแก้ไข</button>
  ${r.status?'<button class="vbtn clear" data-v="">ล้างผล</button>':''}
  ${r.at?`<span class="hint" style="margin:0 0 0 auto">ตรวจล่าสุดโดย${esc(r.by||'')} ${fmtTime(r.at)}</span>`:''}</div>`;
}
function composerHTML(id){
  const anc=tab==='steps'?'<div class="hint">เขียนข้อเสนอแนะภาพรวมของขั้นนี้ หรือเปิดตรวจหัวข้อย่อยเพื่อติ๊กรายย่อหน้า</div>':selPara!=null?`<div class="anchor">อ้างถึงย่อหน้าที่ ${selPara+1}<button id="clrAnc">ยกเลิก</button></div>`:'<div class="hint">แตะย่อหน้าในคำตอบก่อน เพื่อผูกข้อเสนอแนะกับย่อหน้านั้น หรือเขียนเป็นภาพรวมของหัวข้อก็ได้</div>';
  return `<div class="compose"><h4>ข้อเสนอแนะ${role==='นักศึกษา'?' / คำชี้แจงของนักศึกษา':'ของอาจารย์'}</h4>${anc}
  <div class="crow"><button class="mic" id="micBtn" aria-label="พูดข้อเสนอแนะ">${IC.mic}</button>
  <div><textarea id="noteTx" placeholder="พิมพ์ หรือแตะปุ่มไมโครโฟนแล้วพูดว่าอยากให้แก้อะไร"></textarea>
  <div class="tip" id="tip">แป้นพิมพ์เปิดแล้ว แตะปุ่มรูปไมโครโฟนบนแป้นพิมพ์ไอแพด แล้วพูดได้เลย ระบบจะพิมพ์ข้อความให้ จากนั้นกดบันทึก</div></div></div>
  <div class="chips">${['ขาดการอ้างอิง','ตัวเลขไม่ตรงกับบทอื่น','ควรขยายความเพิ่ม','ภาษาไม่เป็นทางการ','รูปแบบไม่ตรงตามคู่มือ','ตารางไม่ครบ'].map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>
  <div class="cfoot"><button class="btn" id="saveNote">บันทึกข้อเสนอแนะ</button></div></div>`;
}
function notesHTML(id){
  const ns=S.notes.filter(n=>n.item===id).sort((a,b)=>a.at-b.at);
  if(!ns.length)return `<div class="notes"><h4>ข้อเสนอแนะในหัวข้อนี้</h4><div class="empty">ยังไม่มีข้อเสนอแนะ</div></div>`;
  return `<div class="notes"><h4>ข้อเสนอแนะในหัวข้อนี้ (${ns.length})</h4>`+ns.map(n=>`<div class="note"><div class="av ${n.by==='นักศึกษา'?'st':''}">${n.by==='นักศึกษา'?'นศ':'อจ'}</div><div>
   <div class="who">${esc(n.by)}<span>${fmtTime(n.at)}</span></div>
   ${n.para!=null&&n.para!==''?`<button class="ref" data-p="${n.para}">ย่อหน้าที่ ${+n.para+1}</button>`:''}
   <div class="body">${esc(n.text)}</div>
   <div class="acts"><span class="pill ${n.done?'done':'wait'}">${n.done?'แก้แล้ว':'รอแก้ไข'}</span>
   <button class="lnk" data-done="${n._id}">${n.done?'เปิดกลับเป็นรอแก้ไข':'ทำเครื่องหมายว่าแก้แล้ว'}</button>
   ${n.by===role?`<button class="lnk dim" data-del="${n._id}">ลบ</button>`:''}</div></div></div>`).join('')+`</div>`;
}
function parasHTML(it){
  const r=rev(it.id), marks=r.marks||{};
  const nc={};S.notes.filter(n=>n.item===it.id&&!n.done&&n.para!=null&&n.para!=='').forEach(n=>nc[n.para]=(nc[n.para]||0)+1);
  return it.paras.map((p,i)=>{const m=marks[i];return `<div class="para ${p.k} ${m?'m-'+m:''} ${selPara===i?'sel':''} ${nc[i]?'has-note':''}" data-i="${i}" ${nc[i]?`data-n="${nc[i]}"`:''}>
   <div class="tx">${esc(p.t)}</div>
   <div class="pm"><button class="ok" data-m="ok" aria-pressed="${m==='ok'}" aria-label="ย่อหน้า ${i+1} ถูกต้อง">${IC.ok}</button><button class="fix" data-m="fix" aria-pressed="${m==='fix'}" aria-label="ย่อหน้า ${i+1} ต้องแก้">${IC.fix}</button></div></div>`}).join('');
}
function bindAnswer(id){
  const A=$('#acol');
  A.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>saveReview(id,{status:b.dataset.v||null}));
  A.querySelectorAll('.para').forEach(el=>{
    const i=+el.dataset.i;
    el.querySelector('.tx').onclick=()=>{selPara=selPara===i?null:i;renderAnswer()};
    el.querySelectorAll('.pm button').forEach(b=>b.onclick=()=>{const marks=Object.assign({},rev(id).marks||{});const v=b.dataset.m;if(marks[i]===v)delete marks[i];else marks[i]=v;if(v==='fix'&&marks[i])selPara=i;saveReview(id,{marks})});
  });
  const tx=$('#noteTx'); if(!tx)return;
  try{tx.value=sessionStorage.getItem('draft.'+id)||''}catch(e){}
  tx.oninput=()=>{try{sessionStorage.setItem('draft.'+id,tx.value)}catch(e){}};
  $('#micBtn').onclick=()=>{tx.focus();$('#tip').classList.add('show');$('#micBtn').classList.add('live')};
  tx.onblur=()=>$('#micBtn')&&$('#micBtn').classList.remove('live');
  A.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{tx.value=(tx.value?tx.value.trim()+' ':'')+b.dataset.c;tx.oninput();tx.focus()});
  const ca=$('#clrAnc'); if(ca)ca.onclick=()=>{selPara=null;renderAnswer()};
  $('#saveNote').onclick=()=>{const t=tx.value.trim();if(!t){toast('กรุณาพิมพ์หรือพูดข้อเสนอแนะก่อน');tx.focus();return}
    addNote({item:id,para:selPara,text:t});tx.value='';try{sessionStorage.removeItem('draft.'+id)}catch(e){}
    if(role==='อาจารย์'&&!rev(id).status)saveReview(id,{status:'fix'});};
  A.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const n=S.notes.find(x=>x._id===b.dataset.done);updNote(n._id,{done:!n.done,doneAt:Date.now(),doneBy:role})});
  A.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delNote(b.dataset.del));
  A.querySelectorAll('.note .ref').forEach(b=>b.onclick=()=>{selPara=+b.dataset.p;renderAnswer();const el=A.querySelector(`.para[data-i="${b.dataset.p}"]`);el&&el.scrollIntoView({block:'center',behavior:'smooth'})});
  A.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function renderAnswer(){
  const id=cur[tab], it=BYID[id]; if(!it)return;
  const keepFocus=document.activeElement&&document.activeElement.id==='noteTx';
  let h='';
  if(tab==='outline'){
    h+=`<div class="qcard"><span class="lbl">คำถามที่ใช้ตรวจ</span><div class="qt">${esc(it.q)}</div><div class="sec">${esc(it.group)} · ${esc(it.title)}</div></div>`;
    h+=verdictHTML(id);
    h+=`<article class="paper"><div class="pmeta"><span>คำตอบจากเล่มสารนิพนธ์</span><span class="num">${it.book?'หน้า '+it.book+(it.bookEnd>it.book?'–'+it.bookEnd:''):'ส่วนนำ'}</span></div><h3>${esc(it.title)}</h3>${parasHTML(it)}</article>`;
  } else {
    h+=`<div class="qcard"><span class="lbl">ขั้นที่ ${it.n} · ${esc(it.title)}</span><div class="qt">${esc(it.q)}</div><div class="sec">คำตอบรวบรวมจากหัวข้อในเล่ม ${it.links.length} หัวข้อ</div></div>`;
    h+=verdictHTML(id);
    h+=`<article class="paper"><div class="pmeta"><span>สาระที่ตอบในขั้นนี้</span><span>แตะหัวข้อสีน้ำเงินเพื่อเปิดตรวจละเอียด</span></div><ul class="sumlist">`+
      it.bul.map(b=>{const m=b.match(/^(\d)\.(\d+)(?:\.\d+)?\s/);const l=m&&BYID['c'+m[1]+'-'+m[2]];return l?`<li class="lk"><button data-go="${l.id}">${esc(b)}</button></li>`:`<li>${esc(b)}</li>`}).join('')+`</ul>`;
    h+=it.links.map(l=>{const x=BYID[l];if(!x)return'';const s=status(l);const ps=x.paras.filter(p=>p.k==='p').slice(0,2);
      return `<section class="excerpt"><header><b>${esc(x.title)}</b><span>${s==='ok'?'<span class="pill pass">ผ่าน</span>':s==='fix'?'<span class="pill wait">ต้องแก้</span>':'<span class="pill chk">ยังไม่ตรวจ</span>'} <button class="lnk" data-go="${l}">เปิดตรวจหัวข้อนี้ ›</button></span></header>${ps.map(p=>`<p>${esc(p.t.length>320?p.t.slice(0,320)+'…':p.t)}</p>`).join('')||'<p>ดูเนื้อหาเต็มในหัวข้อ</p>'}</section>`}).join('');
    h+=`</article>`;
  }
  h+=composerHTML(id)+notesHTML(id);
  const draft=$('#noteTx')?$('#noteTx').value:null;
  $('#acol').innerHTML=h; bindAnswer(id);
  if(keepFocus&&$('#noteTx')){$('#noteTx').focus()}
}
function renderSource(){

      <dt>หน้าในเล่ม</dt><dd>${it.book?it.book+(it.bookEnd>it.book?'–'+it.bookEnd:''):'ส่วนนำ (เลขหน้าอักษร)'}</dd>
      <dt>หน้าในไฟล์</dt><dd>${pages}</dd>
      ${it.toc!=null?`<dt>สารบัญระบุ</dt><dd class="${tocOk?'ok-t':'fix-t'}">หน้า ${it.toc} ${tocOk?'· ตรงกัน':'· ไม่ตรงกับหน้าจริง'}</dd>`:''}
      <dt>จำนวนย่อหน้า</dt><dd>${it.paras.length}</dd></dl>
      <div class="pagestrip" aria-label="ตำแหน่งในเล่ม">${strip}</div></div>`;
    const cs=(it.cites||[]).map(k=>D.refs[k]);
    h+=`<div class="sbox"><h3>เอกสารอ้างอิงที่ใช้ในหัวข้อนี้ (${cs.length})</h3>${cs.length?cs.map(r=>`<div class="ref-i"><b>${esc(r.sur==='National'?'NIST':r.sur)} (${r.yr})</b><br>${esc(r.full)}</div>`).join(''):'<div class="empty">ไม่มีการอ้างอิงในหัวข้อนี้</div>'}</div>`;
    const fd=it.fd||[];
    h+=`<div class="sbox"><h3>ข้อสังเกตจากการตรวจอัตโนมัติ (${fd.length})</h3>${fd.length?fd.map(f=>`<div class="fd"><span class="pill ${f.lv==='แก้'?'wait':f.lv==='ผ่าน'?'pass':'chk'}">${f.lv==='แก้'?'ควรแก้':f.lv==='ผ่าน'?'ผ่าน':'ควรตรวจ'}</span><span>${esc(f.t)}</span></div>`).join(''):'<div class="empty">ไม่พบข้อสังเกต</div>'}</div>`;
    const st=STEPOF[id]||[];
    h+=`<div class="sbox"><h3>ใช้ตอบขั้นตอนการวิจัย</h3>${st.length?`<div class="xlist">${st.map(n=>`<button data-go="s-${n}"><span>ขั้นที่ ${n} ${esc(STEPS[n-1].title)}</span><span>›</span></button>`).join('')}</div>`:'<div class="empty">ไม่ได้ผูกกับขั้นตอนใด</div>'}</div>`;
  } else {
    h+=`<div class="colhead"><h2>ที่มาของคำตอบ</h2></div><div class="sbox">${fileBox}<h3>หัวข้อในเล่มที่ใช้ตอบ</h3><div class="xlist">${it.links.map(l=>{const x=BYID[l];return x?`<button data-go="${l}"><span>${esc(x.title)}</span><span class="num" style="color:var(--ink-3)">${x.book?'น. '+x.book:'ส่วนนำ'}</span></button>`:''}).join('')}</div></div>`;
    h+=`<div class="sbox"><h3>ข้อสังเกตจากการตรวจอัตโนมัติ</h3>${it.fd?`<div class="fd"><span class="pill wait">ควรแก้</span><span>${esc(it.fd)}</span></div>`:'<div class="empty">ไม่พบข้อสังเกตในขั้นนี้</div>'}</div>`;
    const sub=it.links.map(l=>status(l));const d=sub.filter(Boolean).length;
    h+=`<div class="sbox"><h3>ความคืบหน้าของหัวข้อย่อย</h3><div class="kv num"><dt>ตรวจแล้ว</dt><dd>${d} จาก ${sub.length} หัวข้อ</dd><dt>ต้องแก้</dt><dd class="fix-t">${sub.filter(s=>s==='fix').length} หัวข้อ</dd></div></div>`;
  }
  $('#scol').innerHTML=h; $('#scol').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

/* ---------- calendar ---------- */
const TYPES=['นัดพบอาจารย์','กำหนดส่งงาน','สอบ','อื่น ๆ'];
let calM=null, pickDay=null;
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderCal(){
  const today=new Date(); if(!calM)calM=new Date(today.getFullYear(),today.getMonth(),1);
  const y=calM.getFullYear(),m=calM.getMonth(); const start=new Date(y,m,1-new Date(y,m,1).getDay());
  const evs=S.events.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  let g=['อา','จ','อ','พ','พฤ','ศ','ส'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    const es=evs.filter(e=>e.date===k);
    g+=`<button class="day ${d.getMonth()!==m?'out':''} ${k===ymd(today)?'today':''} ${k===pickDay?'pick':''}" data-d="${k}"><span class="dn num">${d.getDate()}</span>${es.slice(0,3).map(e=>`<span class="ev t${TYPES.indexOf(e.type)<0?3:TYPES.indexOf(e.type)}">${esc(e.time?e.time+' ':'')}${esc(e.title)}</span>`).join('')}${es.length>3?`<span class="ev">+${es.length-3}</span>`:''}</button>`}
  const up=evs.filter(e=>e.date>=ymd(today));
  const list=(pickDay?evs.filter(e=>e.date===pickDay):up);
  $('#calView').innerHTML=`<div class="calwrap"><div class="card"><div class="calhead"><h2>${TH_M[m]} ${y+543}</h2><div class="nav"><button id="cPrev" aria-label="เดือนก่อน">‹</button><button id="cToday">วันนี้</button><button id="cNext" aria-label="เดือนถัดไป">›</button></div></div><div class="grid7">${g}</div>
   <div class="legend">${TYPES.map((t,i)=>`<span><i class="ev t${i}" style="padding:0"></i>${t}</span>`).join('')}</div></div>
   <div style="display:grid;gap:16px;align-content:start">
   <div class="card"><h3 style="margin:0 0 10px;font-size:16px">เพิ่มนัดหมาย</h3><form class="form" id="evForm">
     <label>เรื่อง<input id="evTitle" required placeholder="เช่น นัดพบอาจารย์ตรวจบทที่ 4"></label>
     <div class="two"><label>วันที่<input type="date" id="evDate" required value="${pickDay||ymd(today)}"></label><label>เวลา<input type="time" id="evTime"></label></div>
     <label>ประเภท<select id="evType">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
     <label>สถานที่หรือช่องทาง<input id="evPlace" placeholder="เช่น ห้องอาจารย์ หรือ ประชุมออนไลน์"></label>
     <button class="btn" type="submit">บันทึกนัดหมาย</button></form></div>
   <div class="card"><h3 style="margin:0;font-size:16px">${pickDay?'นัดหมายวันที่ '+(+pickDay.slice(8))+' '+TH_MS[+pickDay.slice(5,7)-1]+' '+(+pickDay.slice(0,4)+543):'นัดหมายที่กำลังจะถึง'}</h3>
   <div class="evl">${list.length?list.map(e=>{const d=new Date(e.date+'T00:00');return `<div class="evi"><div class="d"><b class="num">${d.getDate()}</b><span>${TH_MS[d.getMonth()]}</span></div><div class="t">${esc(e.title)}<span>${esc(e.type||'')}${e.time?' · '+esc(e.time)+' น.':''}${e.place?' · '+esc(e.place):''}</span></div><button class="lnk dim" data-dev="${e._id}">ลบ</button></div>`}).join(''):'<div class="empty">ยังไม่มีนัดหมาย เพิ่มได้จากแบบฟอร์มด้านบน หรือแตะวันที่ในปฏิทิน</div>'}</div>
   ${pickDay?'<button class="lnk" id="clrDay" style="margin-top:8px">แสดงนัดหมายทั้งหมดที่กำลังจะถึง</button>':''}</div></div></div>`;
  $('#cPrev').onclick=()=>{calM=new Date(y,m-1,1);renderCal()};$('#cNext').onclick=()=>{calM=new Date(y,m+1,1);renderCal()};$('#cToday').onclick=()=>{calM=null;pickDay=null;renderCal()};
  $('#calView').querySelectorAll('.day').forEach(b=>b.onclick=()=>{pickDay=pickDay===b.dataset.d?null:b.dataset.d;renderCal()});
  $('#calView').querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>delEvent(b.dataset.dev));
  const cd=$('#clrDay');if(cd)cd.onclick=()=>{pickDay=null;renderCal()};
  $('#evForm').onsubmit=ev=>{ev.preventDefault();const t=$('#evTitle').value.trim(),d=$('#evDate').value;if(!t||!d)return;
    addEvent({title:t,date:d,time:$('#evTime').value,type:$('#evType').value,place:$('#evPlace').value.trim(),by:role,at:Date.now()});pickDay=d;calM=new Date(+d.slice(0,4),+d.slice(5,7)-1,1)};
}

/* ---------- summary ---------- */
function renderSum(){
  let ok=0,fx=0,pt=0;ITEMS.forEach(it=>{const s=status(it.id);if(s==='ok')ok++;else if(s==='fix')fx++;else if(s==='part')pt++});
  const todo=ITEMS.length-ok-fx; const pend=S.notes.filter(n=>!n.done);
  const groups=[...new Set(ITEMS.map(i=>i.group))];
  const auto=ITEMS.flatMap(it=>(it.fd||[]).filter(f=>f.lv!=='ผ่าน'&&!f.t.startsWith('สารบัญระบุ')).map(f=>({it,f})));
  const tocBad=ITEMS.filter(it=>(it.fd||[]).some(f=>f.t.startsWith('สารบัญระบุ')));
  const seen=new Set();const autoU=auto.filter(a=>{if(seen.has(a.f.t))return false;seen.add(a.f.t);return true});
  $('#sumView').innerHTML=`<div class="tiles num">
   <div class="tile"><b>${ITEMS.length}</b><span>หัวข้อทั้งหมด</span></div>
   <div class="tile"><b class="ok-t">${ok}</b><span>ผ่าน</span></div>
   <div class="tile"><b class="fix-t">${fx}</b><span>ต้องแก้ไข</span></div>
   <div class="tile"><b>${todo}</b><span>ยังไม่ตรวจ</span></div>
   <div class="tile"><b class="fix-t">${pend.length}</b><span>ข้อเสนอแนะค้าง</span></div></div>
  <div class="sumgrid"><div class="card"><h3 style="margin:0 0 8px;font-size:16px">ความคืบหน้ารายบท</h3>
   ${groups.map(g=>{const n=ITEMS.filter(i=>i.group===g);const o=n.filter(i=>status(i.id)==='ok').length,f=n.filter(i=>status(i.id)==='fix').length;
     return `<div class="chrow"><span>${esc(g.replace(/^บทที่ (\d) .*/,'บทที่ $1'))}</span><div class="bar"><i class="ok" style="width:${o/n.length*100}%"></i><i class="fix" style="width:${f/n.length*100}%"></i></div><span class="num" style="text-align:right">${o+f}/${n.length}</span></div>`}).join('')}
   <div class="legend"><span><i style="background:var(--ok)"></i>ผ่าน</span><span><i style="background:var(--fix)"></i>ต้องแก้</span><span><i style="background:var(--desk);border:1px solid var(--line-2)"></i>ยังไม่ตรวจ</span></div></div>
   <div class="card"><h3 style="margin:0 0 4px;font-size:16px">ข้อเสนอแนะที่รอแก้ไข (${pend.length})</h3>
   ${pend.length?pend.sort((a,b)=>a.at-b.at).map(n=>{const it=BYID[n.item];return `<button class="pend" data-go="${n.item}"><span>${esc(n.text)}<small>${esc(it?it.title:'')}${n.para!=null&&n.para!==''?' · ย่อหน้าที่ '+(+n.para+1):''} · ${esc(n.by)} ${fmtTime(n.at)}</small></span><span class="pill wait">รอแก้</span></button>`}).join(''):'<div class="empty">ยังไม่มีข้อเสนอแนะค้าง</div>'}</div>
   <div class="card" style="grid-column:1/-1"><h3 style="margin:0 0 4px;font-size:16px">ข้อสังเกตจากการตรวจอัตโนมัติ</h3>
   ${autoU.map(a=>`<button class="pend" data-go="${a.it.id}"><span>${esc(a.f.t)}<small>${esc(a.it.title)}</small></span><span class="pill ${a.f.lv==='แก้'?'wait':'chk'}">${a.f.lv==='แก้'?'ควรแก้':'ควรตรวจ'}</span></button>`).join('')}
   <button class="pend" data-go="${tocBad[0]?tocBad[0].id:'f-4'}"><span>เลขหน้าในสารบัญไม่ตรงกับหน้าจริง ${tocBad.length} หัวข้อ (ส่วนใหญ่คลาดเคลื่อน 1–2 หน้า ตั้งแต่บทที่ 1 หัวข้อ 1.8 เป็นต้นไป)<small>แตะเพื่อดูทีละหัวข้อ หรือกรอง "มีข้อสังเกต" ในหน้าโครงร่าง</small></span><span class="pill wait">ควรแก้</span></button></div></div>`;
  $('#sumView').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

renderAll();
})();
</script>

</body></html>
